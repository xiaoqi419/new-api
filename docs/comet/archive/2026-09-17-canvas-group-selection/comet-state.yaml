  - id: A5
    source: specs/canvas-group-selection/spec.md
    text: 内嵌画布从可信宿主取得当前登录账户允许使用的令牌。选择分组/令牌之后，模型拉取直接使用编辑草稿中的凭证，无需先保存。后台初始化、模型目录响应和同渠道配置对象更新不得覆盖正在编辑的草稿。取消关闭后再次打开应恢复已保存配置；账户或可信宿主发生变化时不可继续使用旧凭证。
    result: passed
    reason:
      text: 取消重开恢复保存值；账户或来源变化清草稿秘密；等价重渲染保留选择。
      truncated: false
  - id: A6
    source: specs/canvas-group-selection/spec.md
    text: 保存后，模型和生成请求应使用该渠道自己的所选令牌。页面重新加载时，通过当前宿主响应中的账户ID与令牌ID恢复选择，避免静默回退到其他令牌。仅非秘密选择身份可持久化；apiKey和verifiedKey只在内存中保存。不存在、已撤销或属于另一账户的选择不获授权。
    result: passed
    reason:
      text: 仅当前账户+令牌ID命中授权列表才恢复；撤权或跨账户选择清空，不退第一令牌；多渠道Authorization独立。
      truncated: false
  - id: A7
    source: specs/canvas-group-selection/spec.md
    text: 模型目录的成功或失败结果只能作用于发起时相同的渠道凭证、地址和API格式。多渠道的模型验证标记须分别绑定各自的密钥，不能套用首个渠道密钥。
    result: passed
    reason:
      text: 异步结果比较channel/key/base/format/host identity；成功失败都拒绝旧响应，每渠道verifiedKey独立。
      truncated: false
  - id: A8
    source: specs/canvas-group-selection/spec.md
    text: 开发验收以brief中的A1至A4为唯一验收列表。回归测试在网络边界模拟模型与生图响应，验证实际请求凭证，不对生产执行计费生图。独立代码验收通过后，走提交、PR、CI、合并origin/main及精确合并SHA构建；只重建双站app服务。不得修改数据库内容、结构或卷，不得重启数据库、Redis或网关。发布后另行记录版本和容器不变证据，完成部署才交付。
    result: passed
    reason:
      text: 开发期代码和发布方案验收通过；网络mock无生产计费；发布仍需合并后执行并核对基础设施不变。
      truncated: false

acceptance:
  - id: A1
    source: brief.md
    text: 全新 SQLite 数据库启动迁移后，`subscription_plans` 包含 `scope_group varchar(64)
      DEFAULT ''`，创建 `ScopeGroup="codex"` 的套餐成功并可读回。
    result: passed
    reason:
      text: 全新 SQLite 路径的 CREATE TABLE DDL 已包含 scope_group varchar(64) DEFAULT
        ''；focused test 验证可创建 ScopeGroup=codex 的套餐并按原值读回。
      truncated: false
  - id: A2
    source: brief.md
    text: 历史 SQLite 表缺少 `scope_group` 且已有套餐数据时，启动迁移会补列，既有行保持不变并读取为空作用域。
    result: passed
    reason:
      text: legacy required 列清单通过 ALTER TABLE ADD COLUMN 补齐
        scope_group；测试验证历史套餐字段保持不变，ScopeGroup 读取为空。
      truncated: false
  - id: A3
    source: brief.md
    text: 对同一数据库重复执行迁移不会报错或重复修改 schema。
    result: passed
    reason:
      text: legacy 回归测试重复调用迁移并验证成功，既有 codex 值保持不变，scope_group 最终仅有一列。
      truncated: false
  - id: A4
    source: brief.md
    text: MySQL 和 PostgreSQL 继续通过既有 GORM `AutoMigrate(&SubscriptionPlan{})` 维护该列，不引入
      SQLite 语法。
    result: passed
    reason:
      text: 两处非 SQLite 分支仍调用 DB.AutoMigrate(&SubscriptionPlan{})；本次 diff 未改变这些分支。
      truncated: false
  - id: A5
    source: specs/subscription-plan-schema/spec.md
    text: Fresh SQLite schema - **WHEN** 服务首次在空 SQLite 数据库执行主数据库迁移 - **THEN**
      `subscription_plans` 表包含 `scope_group` 列 - **AND** 该列使用 `varchar(64)
      DEFAULT ''` - **AND** 创建带显式作用域分组的订阅套餐成功并可按原值读回。
    result: passed
    reason:
      text: fresh SQLite 隔离测试验证列存在、显式 codex 写入成功且读回一致。
      truncated: false
  - id: A6
    source: specs/subscription-plan-schema/spec.md
    text: Upgrade an existing SQLite schema - **WHEN** 已有 `subscription_plans` 表缺少
      `scope_group` 且包含历史套餐行 - **THEN** 启动迁移使用 SQLite 支持的 `ALTER TABLE ... ADD
      COLUMN` 补齐该列 - **AND** 历史套餐的既有字段和值保持不变 - **AND** 历史套餐的 `scope_group`
      读取为空字符串，以保持适用于所有分组的旧行为。
    result: passed
    reason:
      text: legacy 测试建立不含 scope_group 且带历史行的表，迁移后验证补列、历史字段保留和默认空 scope。
      truncated: false
  - id: A7
    source: specs/subscription-plan-schema/spec.md
    text: Idempotent startup - **WHEN** 同一数据库已经包含 `scope_group` 并再次执行迁移 - **THEN**
      迁移成功结束 - **AND** 不重复添加列或破坏现有套餐数据。
    result: passed
    reason:
      text: 测试覆盖迁移重复执行，确认不报错、不覆盖已写入的 scope_group，也不重复添加列。
      truncated: false
  - id: A8
    source: specs/subscription-plan-schema/spec.md
    text: Other supported databases - **WHEN** 主数据库为 MySQL 或 PostgreSQL - **THEN**
      继续使用 GORM `AutoMigrate(&SubscriptionPlan{})` 管理 `scope_group` - **AND**
      不执行 SQLite 专用 PRAGMA 或 DDL。
    result: passed
    reason:
      text: MySQL/PostgreSQL 仍由既有 AutoMigrate 路径管理；SQLite helper 在非 SQLite 数据库类型下立即返回。
      truncated: false
  - id: A9
    source: specs/subscription-plan-schema/spec.md
    text: "`SubscriptionPlan.ScopeGroup` 的数据库列 MUST 存在于全新和历史 SQLite schema。"
    result: passed
    reason:
      text: fresh CREATE DDL 和历史缺列补齐清单均包含 scope_group；两个隔离 SQLite 场景均通过。
      truncated: false
  - id: A10
    source: specs/subscription-plan-schema/spec.md
    text: SQLite CREATE DDL 与缺列补齐清单 MUST 使用相同的列名、类型和默认值。
    result: passed
    reason:
      text: 两个 schema 路径的列名、类型和默认值完全一致，均为 scope_group varchar(64) DEFAULT ''。
      truncated: false
  - id: A11
    source: specs/subscription-plan-schema/spec.md
    text: 迁移 MUST 保留空作用域代表全分组适用的历史业务语义。
    result: passed
    reason:
      text: 历史行迁移后 ScopeGroup 为空字符串，保留空作用域适用于所有分组的既有业务语义。
      truncated: false
  - id: A12
    source: specs/subscription-plan-schema/spec.md
    text: 迁移 MUST 支持重复执行。
    result: passed
    reason:
      text: 同一 legacy 数据库连续迁移两次成功，scope_group 仅存在一列，已写入数据保持不变。
      truncated: false

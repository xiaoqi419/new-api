acceptance:
  - id: A1
    source: specs/embedded-config-dialog-dismiss/spec.md
    text: dismiss after successful save - **Given** the default channel shows a
      non-zero model count after save - **When** the user clicks「完成」or close -
      **Then** the dialog remains closed
    result: passed
    reason:
      text: "Configured channels skip auto-open; finishConfig still closes the dialog.
        Test: does not auto-open after a channel has a key and models."
      truncated: false
  - id: A2
    source: specs/embedded-config-dialog-dismiss/spec.md
    text: bootstrap error does not trap the dialog - **Given** a channel already has
      a key and models - **And** host bootstrap `modelStatus` is `error` -
      **When** the dialog is closed - **Then** it is not reopened automatically
    result: passed
    reason:
      text: needsConfigDialog is false when a channel has apiKey and models, even if
        modelStatus is error.
      truncated: false
  - id: A3
    source: specs/embedded-config-dialog-dismiss/spec.md
    text: When an embedded Infinite Canvas user has successfully saved at least one
      channel with an API key and selected models, the「配置与用户偏好」dialog MUST close
      and stay closed. Host bootstrap catalog errors MUST NOT reopen it.
    result: passed
    reason:
      text: Successful save leaves models on the channel; HostBootstrapStatus no
        longer reopens solely on catalog error.
      truncated: false
  - id: A4
    source: specs/embedded-config-dialog-dismiss/spec.md
    text: "If any channel has a non-empty `apiKey` and `models.length > 0`:"
    result: passed
    reason:
      text: hasConfiguredChannel requires a trimmed apiKey and models.length > 0.
      truncated: false
  - id: A5
    source: specs/embedded-config-dialog-dismiss/spec.md
    text: Clicking「完成」or the dialog close control MUST set the dialog closed.
    result: passed
    reason:
      text: AppConfigModal finishConfig still calls setConfigDialogOpen(false);
        dismiss flag prevents reopen.
      truncated: false
  - id: A6
    source: specs/embedded-config-dialog-dismiss/spec.md
    text: '`HostBootstrapStatus` MUST NOT call `openConfigDialog` solely because
      `modelStatus === "error"` or host token bootstrap failed.'
    result: passed
    reason:
      text: modelStatus error is ignored when a channel is already configured;
        unconfigured close also sets dismissedRef.
      truncated: false
  - id: A7
    source: specs/embedded-config-dialog-dismiss/spec.md
    text: If no channel has both a key and at least one model, the dialog MAY open
      automatically once so the user can configure a key.
    result: passed
    reason:
      text: Empty channels still auto-open once; existing no-key test still passes.
      truncated: false
  - id: A8
    source: specs/embedded-config-dialog-dismiss/spec.md
    text: The existing configuration button MUST still open the dialog at any time.
    result: passed
    reason:
      text: embedded-visibility still asserts the 配置 button is present while
        Agent/docs/GitHub are hidden.
      truncated: false

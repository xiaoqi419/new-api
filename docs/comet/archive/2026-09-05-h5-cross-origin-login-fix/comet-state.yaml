acceptance:
  - id: A1
    source: brief.md
    text: 从 `https://aierxin.cc/admin-h5/sign-in` 选择国际站并发起登录时，浏览器不再因 CORS
      把响应转换为“暂时无法登录”；无效账号能够显示后端返回的业务错误。
    result: passed
    reason:
      text: 在 https://aierxin.cc/admin-h5/sign-in
        的浏览器中选择国际站并提交合成无效账号后，页面显示后端业务错误“用户名或密码错误，或用户已被封禁”，不再显示 CORS
        网络错误或“暂时无法登录”。
      truncated: false
  - id: A2
    source: brief.md
    text: "对 `https://aierxin.cc` 和 `https://codezip.io` 的 API 请求分别返回匹配的
      `Access-Control-Allow-Origin` 与 `Access-Control-Allow-Credentials:
      true`，并带 `Vary: Origin`。"
    result: passed
    reason:
      text: 线上从服务器实测 aierxin.cc 与 codezip.io 两个方向的跨站请求均返回匹配
        ACAO、Allow-Credentials=true 和 Origin 变化；公共状态接口版本头与响应均为
        20260905-27ab1a99a。
      truncated: false
  - id: A3
    source: brief.md
    text: OPTIONS 预检允许 H5 使用的 `POST` 方法和
      `Content-Type`、`Authorization`、`X-Auth-Session`、`Cache-Control` 等请求头；未知
      origin 不获得 CORS 放行头。
    result: passed
    reason:
      text: 线上五个 API 路径的 OPTIONS 预检允许 POST 与 Content-Type、Authorization、X-Auth-Session
        等请求头；未知 origin 返回 403 且无放行头；无 Origin 预检返回 204 且无 CORS origin 头。
      truncated: false
  - id: A4
    source: brief.md
    text: 真实 `SetApiRouter` 注册的 `/api` OPTIONS 预检能够命中 H5 CORS middleware，而不是因 Gin
      未匹配 OPTIONS 路由返回 404。
    result: passed
    reason:
      text: 真实 SetApiRouter 回归测试通过；线上
        /api/user/login、/api/user/login/2fa、/api/user/auth/refresh、/api/user/auth/logout
        和 /api/status 预检均返回 204 与显式来源。
      truncated: false
  - id: A5
    source: brief.md
    text: "`/api/user/login`、`/api/user/login/2fa`、`/api/user/auth/refresh` 和
      `/api/user/auth/logout` 均经过该策略，现有无 Origin 的同源请求继续工作。"
    result: passed
    reason:
      text: 以上登录、2FA、refresh、logout 路径均经 H5 CORS 策略；无 Origin 兼容性由本地测试和线上无 Origin
        OPTIONS 检查覆盖。
      truncated: false
  - id: A6
    source: specs/h5-cross-origin-login-fix/spec.md
    text: 统一 Admin H5 运行在一个站点 origin、请求另一个站点 API 时，后端必须按请求的 `Origin` 返回显式 CORS
      允许值。`https://aierxin.cc` 与 `https://codezip.io` 是本次允许的 H5 origin；允许携带会话
      Cookie，并覆盖 `/api` 路由组中的登录、2FA、refresh、logout、状态和用户 API。安全 Cookie 模式下
      refresh Cookie 使用 `SameSite=None; Secure`，以便跨站 H5 在刷新页面后继续保持会话。没有 `Origin`
      的同源请求保持现有行为，其他 origin 不获得放行头。
    result: passed
    reason:
      text: H5CORS 仅使用两个 HTTPS origin，安全模式 refresh Cookie 使用 SameSite=None;
        Secure；两套运行环境均为 SESSION_COOKIE_SECURE=true 且 SESSION_COOKIE_TRUSTED_URL
        包含两个 origin；本地 cookie 测试通过。
      truncated: false
  - id: A7
    source: specs/h5-cross-origin-login-fix/spec.md
    text: 不得将 `AllowAllOrigins=true` 与 `AllowCredentials=true` 用于 H5
      跨域策略。预检必须限制到实际使用的方法和请求头。启用 `SESSION_COOKIE_SECURE` 时，refresh Cookie 为
      `SameSite=None; Secure`，且两个 H5 origin 必须能够通过 `SESSION_COOKIE_TRUSTED_URL`
      的可信 origin 校验；不安全本地模式继续使用 `SameSite=Strict`。
    result: passed
    reason:
      text: 代码未将 H5 AllowAllOrigins 与凭据同时启用；预检方法和请求头为显式白名单；安全与不安全 cookie 模式测试均通过。
      truncated: false
  - id: A8
    source: specs/h5-cross-origin-login-fix/spec.md
    text: "A1：允许 `https://aierxin.cc` 和 `https://codezip.io`，响应包含匹配的
      `Access-Control-Allow-Origin`、`Access-Control-Allow-Credentials: true` 和
      `Vary: Origin`。"
    result: passed
    reason:
      text: "线上双方向跨站实测返回精确 ACAO、Allow-Credentials=true；Vary: Origin 由应用返回并在请求经过网关时保留。"
      truncated: false
  - id: A9
    source: specs/h5-cross-origin-login-fix/spec.md
    text: A2：真实 `SetApiRouter` 的 OPTIONS 预检能够命中 H5 CORS middleware，返回 204，并允许 H5
      登录/会话所需的 POST、GET、PUT、DELETE、OPTIONS 方法以及
      Content-Type、Authorization、X-Auth-Session、Cache-Control 等请求头。
    result: passed
    reason:
      text: 真实路由测试覆盖 OPTIONS catch-all，线上所有认证相关路径预检均为 204，允许的方法包含
        POST、GET、PUT、DELETE、OPTIONS 等。
      truncated: false
  - id: A10
    source: specs/h5-cross-origin-login-fix/spec.md
    text: A3：未知 origin 没有 CORS 放行头；没有 Origin 的同源请求仍返回业务响应。
    result: passed
    reason:
      text: 未知来源线上预检返回 403 且无 ACAO；无 Origin 请求保持 204/业务兼容。
      truncated: false
  - id: A11
    source: specs/h5-cross-origin-login-fix/spec.md
    text: A4：`/api/user/login`、`/api/user/login/2fa`、`/api/user/auth/refresh`、`/api/user/auth/logout`
      和 `/api/status` 都安装 H5 CORS，国际站无效账号请求能够读到后端 JSON 错误而不是浏览器网络错误。
    result: passed
    reason:
      text: 线上 codezip.io 与 aierxin.cc 状态接口均返回 success=true 和版本
        20260905-27ab1a99a；国际登录合成无效账号响应可被 H5 浏览器读取。
      truncated: false
  - id: A12
    source: specs/h5-cross-origin-login-fix/spec.md
    text: A5：Go middleware 回归测试和受影响测试通过；线上 curl/浏览器检查记录两个 origin 的预检和实际请求结果。
    result: passed
    reason:
      text: go test -count=1 ./router ./middleware ./service ./controller ./common、go
        vet ./router ./middleware、git diff --check 均通过；服务器 Docker 构建成功；线上双域名
        curl、预检、无效登录和浏览器检查通过。
      truncated: false
  - id: A13
    source: specs/h5-cross-origin-login-fix/spec.md
    text: A6：未写入认证凭据，未改变站点数据隔离或国内访问限制；Comet Verify 未通过前保持 change active。
    result: passed
    reason:

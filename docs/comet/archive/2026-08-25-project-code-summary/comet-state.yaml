acceptance:
  - id: A1
    source: specs/project-code-summary/spec.md
    text: 仓库必须提供 `docs/project-code-summary.md`。它是本 fork 二次开发的维护/交接入口，优先说明当前 main
      已包含的二开能力、其状态和维护边界，而不是把上游 New API 的全仓概览作为主要交付物。
    result: passed
    reason:
      text: The document is a second-development maintenance and handoff entry for
        this fork, not an upstream-wide architecture manual.
      truncated: false
  - id: A2
    source: specs/project-code-summary/spec.md
    text: 调查快照、证据等级和排除项：记录 `origin/main` SHA、日期、检索降级情况，并说明不对生成物、依赖、二进制与 vendored
      第三方代码作逐行承诺。
    result: passed
    reason:
      text: It records date, origin/main SHA, evidence/status levels, fast-context
        fallback, and review boundaries.
      truncated: false
  - id: A3
    source: specs/project-code-summary/spec.md
    text: 当前发布基线：明确 `origin/main` 是唯一生产真源，说明 SHA、镜像/容器版本不一致时的比较和停线原则。
    result: passed
    reason:
      text: origin/main is the sole production source and deployment drift requires
        stop-and-compare handling.
      truncated: false
  - id: A4
    source: specs/project-code-summary/spec.md
    text: 已完成二开能力：至少覆盖商业支付/运营、身份/访问/公共体验、模型/生成/扩展三类；每项给出路径、状态和维护注意事项。
    result: passed
    reason:
      text: Commercial, identity/public experience, and model/generation capabilities
        have status, paths, and maintenance cautions.
      truncated: false
  - id: A5
    source: specs/project-code-summary/spec.md
    text: 未完成与风险：分别列出待线上验收、保留但隐藏、搁置/未开始，以及支付/计费、数据库、缓存、双前端、i18n、上游整合和版本漂移风险。
    result: passed
    reason:
      text: Online validation, hidden or shelved work, and the required risk
        categories are separately documented.
      truncated: false
  - id: A6
    source: specs/project-code-summary/spec.md
    text: 后续 Agent 流程：从 main、Comet、fast-context/rg、Shape、Build、Verify、PR/CI、精确 SHA
      构建、应用部署到清理分支的明确顺序。
    result: passed
    reason:
      text: The document specifies main, Comet, Shape, Build, independent Verify,
        PR/CI, exact-SHA build, deployment, and branch cleanup.
      truncated: false
  - id: A7
    source: specs/project-code-summary/spec.md
    text: 最小基础边界：只说明二开 Agent 需要跨越的
      HTTP/业务、Relay/计费、RelayKit、数据/缓存、三套前端、Docker/Electron 边界，不复述上游全部实现。
    result: passed
    reason:
      text: It describes only the necessary HTTP, Relay, billing, RelayKit,
        data/cache, frontend, Docker, and Electron boundaries.
      truncated: false
  - id: A8
    source: specs/project-code-summary/spec.md
    text: 常用验证命令和“历史计划不等于现状”的说明。
    result: passed
    reason:
      text: Focused verification commands and the historical-plan-versus-current-fact
        distinction are present.
      truncated: false

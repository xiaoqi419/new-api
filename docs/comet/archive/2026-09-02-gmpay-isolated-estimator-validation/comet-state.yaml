acceptance:
  - id: A1
    source: brief.md
    text: A1：真实 TronGrid 返回大量无关参数、缺失 `value` 或负值无关参数时，解析成功并得到正的 energy/bandwidth 费率。
    result: passed
    reason:
      text: Independent focused service tests passed. The TronGrid-shaped regression
        includes unrelated entries, an unrelated missing value, and an unrelated
        negative value while returning positive getEnergyFee and
        getTransactionFee values.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：真实 TRON RPC 与 CoinGecko 正常时，`USDT/tron/USD` 估算返回
      `native_amount`、`fee_amount`、`total_amount` 和 RPC/价格来源证据。
    result: passed
    reason:
      text: Read-only public TRON and market probes passed. The dynamic endpoint
        contract returns chain_network_estimate with 6.845 TRX native amount,
        2.21 USD fee, and 3.21 USD total for a 1.00 USD base, plus RPC and price
        provenance.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：CoinGecko 被限制（HTTP 429）时，估算自动使用 CoinPaprika，报价仍通过金额与新鲜度校验。
    result: passed
    reason:
      text: The CoinGecko HTTP 429 regression passed and automatically used
        CoinPaprika with validated TRX identity, USD currency, positive price,
        freshness, and api.coinpaprika.com provenance.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：动态估算不可用时，管理员百分比兜底和固定金额兜底分别返回正确费用，并明确 `fallback` 来源，不声称为动态链上报价。
    result: passed
    reason:
      text: Controller regressions passed for both fixed and percentage administrator
        fallback after dynamic-estimator failure. Results use explicit
        admin_fallback provenance and exact USD fee/total amounts.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：所有验证均使用隔离 SQLite/配置；不会连接生产 PostgreSQL、Redis 或生产 GMPay 网关。
    result: passed
    reason:
      text: Tests use in-memory SQLite, synthetic configuration, and httptest
        fixtures. No production PostgreSQL, Redis, GMPay merchant gateway,
        payment, order, callback, signing, broadcast, or production-data write
        was performed.
      truncated: false
  - id: A6
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: GMPay 网络手续费估算必须兼容真实 TronGrid 响应，并在动态链上或行情估算失败时安全地使用管理员兜底。验证过程隔离于生产支付和资金。
    result: passed
    reason:
      text: Focused GMPay/network-fee suites confirm real TronGrid compatibility,
        dynamic estimation, fail-closed behavior, and administrator fallback,
        all within isolated non-mutating verification.
      truncated: false
  - id: A7
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: TRON 链参数解析只提取 `getEnergyFee` 和 `getTransactionFee`，忽略无关条目、缺失 `value`
      条目及无关负值；目标键缺失、非法或为负时仍 fail-closed。
    result: passed
    reason:
      text: parseTRONChainFees consumes only getEnergyFee and getTransactionFee,
        ignores unrelated malformed/missing/negative entries, and rejects
        missing, malformed, or negative target values. Parser regressions
        passed.
      truncated: false
  - id: A8
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: 真实 TRON RPC + 主行情源成功时，估算返回正的
      `native_amount`、`fee_amount`、`total_amount`，并记录 RPC/价格来源和时间戳。
    result: passed
    reason:
      text: Dynamic estimation produces positive native_amount, fee_amount, and
        total_amount and records RPC source/method, price source/timestamp,
        quote time, and expiry; public read-only endpoints and the controller
        contract were verified.
      truncated: false
  - id: A9
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: 主行情源 HTTP 429 或响应无效时，自动尝试允许的 CoinPaprika 备用源；备用响应必须匹配资产身份、币种、价格和新鲜度。
    result: passed
    reason:
      text: The allowlisted CoinPaprika fallback is used after CoinGecko rate limiting
        or invalid response and enforces asset identity, selected currency,
        bounded positive price, and freshness. Regressions passed.
      truncated: false
  - id: A10
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: 动态估算错误只能进入已校验的管理员百分比或固定金额兜底；兜底输出包含明确的 fallback 来源，不伪装成链上动态报价。
    result: passed
    reason:
      text: Dynamic estimation is attempted first; only validated configured
        fixed/percentage rules run after dynamic failure. The output remains
        admin_fallback and is never labeled chain_network_estimate.
      truncated: false
  - id: A11
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: 验证环境使用独立配置和 SQLite；任何测试网关使用独立容器、数据、网络、端口和测试商户凭据。不得触发真实支付或链上写操作。
    result: passed
    reason:
      text: Verification used isolated SQLite/configuration, local httptest fixtures,
        and read-only public requests. EPUSDT deployment, orders, payments,
        signing, broadcast, callbacks, and production access are explicit
        non-goals and were not performed.
      truncated: false
  - id: A12
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: A1：真实 TronGrid 参数响应形状的回归测试通过，且 `parseTRONChainFees` 不因无关或缺失字段失败。
    result: passed
    reason:
      text: The TronGrid response-shape regression and target-field fail-closed cases
        passed independently and in the focused service suite.
      truncated: false
  - id: A13
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: A2：真实公开端点返回一条有效 TRON/USDT/USD 估算，金额字段和证据字段均有效。
    result: passed
    reason:
      text: The fee-test endpoint contract exposes a valid TRON/USDT/USD dynamic quote
        with 6.845 TRX native amount, 2.21 USD fee, 3.21 USD total, and evidence
        fields; public endpoint probes passed.
      truncated: false
  - id: A14
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: A3：模拟 CoinGecko 429 时，CoinPaprika 回退返回有效报价且来源为备用主机。
    result: passed
    reason:
      text: The simulated CoinGecko 429 regression returned a valid CoinPaprika quote
        with api.coinpaprika.com provenance and verified identity, price,
        currency, and freshness.
      truncated: false
  - id: A15
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: A4：百分比和固定金额管理员兜底在动态错误时返回预期金额、币种和 fallback 来源。
    result: passed
    reason:
      text: Fixed and percentage fallback regressions passed after simulated dynamic
        failure, including exact USD amounts and canonical admin_fallback
        provenance.
      truncated: false
  - id: A16
    source: specs/gmpay-isolated-estimator-validation/spec.md
    text: A5：测试运行不连接生产数据库、Redis、GMPay 商户网关，不创建真实支付或链上交易。
    result: passed
    reason:
      text: All executed checks used isolated local fixtures or read-only public
        endpoints. No production database, Redis, merchant gateway, payment
        order, chain transaction, callback, or other write operation occurred.
      truncated: false

    source: brief.md
    text: A3：SMTP 服务接受 TCP 后不发送 greeting、TLS 握手卡住或 STARTTLS 卡住时，邮件发送在统一 deadline
      内返回可识别的阶段错误，而不是等待到网关 504。
    result: passed
    reason:
      text: common/email.go applies one 10-second absolute deadline across dial,
        SetDeadline, TLS, and SMTP; the fresh common tests passed.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：`/api/option/test_email` 保留现有鉴权与响应契约，失败不泄露 SMTP token、账号、邮件正文或收件人。
    result: passed
    reason:
      text: The test-email endpoint remains protected and smtpSafeError exposes only a
        safe stage and timeout/failure classification.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：正常的明文 SMTP、STARTTLS 和隐式 TLS 发送路径继续工作，现有 TLS 校验配置保持有效。
    result: passed
    reason:
      text: Plain SMTP, STARTTLS, implicit TLS, and certificate validation regressions
        remain covered; fresh go test ./common passed.
      truncated: false

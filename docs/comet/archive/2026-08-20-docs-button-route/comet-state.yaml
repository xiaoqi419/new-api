  - id: A1
    source: brief.md
    text: 访客在首页点击 Hero 的“文档”按钮后，当前单页应用导航到 `/docs`。
    result: passed
    reason:
      text: 真实 Memory Router 参数化测试覆盖未登录场景；点击 Docs 后 pathname 为 /docs，独立重跑通过。
      truncated: false
  - id: A2
    source: brief.md
    text: 已登录用户点击同一按钮也进入 `/docs`，不受登录态影响。
    result: passed
    reason:
      text: 同一真实 Router 测试覆盖已登录场景；Docs 按钮不依赖登录态，点击后 pathname 为 /docs。
      truncated: false
  - id: A3
    source: brief.md
    text: 即使后台 `docs_link` 配置为外部 URL，Hero 按钮仍进入站内 `/docs`，且不打开新标签页。
    result: passed
    reason:
      text: 测试注入外部 docs_link，断言 CTA href=/docs、无 target、不是外部 href 且 useStatus
        未调用；Playwright 在相同配置下也通过。
      truncated: false
  - id: A4
    source: brief.md
    text: 顶部导航的站内文档入口和其它明确的外部资料链接保持原行为。
    result: passed
    reason:
      text: 顶部导航仍生成 href=/docs；AppChip、Cherry Studio 和 footer 的明确外部资料链接保持原 URL、新窗口与安全
        rel 语义。
      truncated: false
  - id: A5
    source: specs/home-docs-navigation/spec.md
    text: Hero documentation button uses the in-app docs route - **WHEN**
      访客或已登录用户在首页点击 Hero 的“文档”按钮 - **THEN** 应用 MUST 通过 TanStack Router 在当前标签页导航到
      `/docs` - **AND** 导航 MUST 保持单页应用行为。
    result: passed
    reason:
      text: Hero 通过 Button render={<Link to='/docs' />} 渲染 CTA；真实 Router 点击证明 SPA 状态从
        / 变为 /docs。
      truncated: false
  - id: A6
    source: specs/home-docs-navigation/spec.md
    text: External documentation configuration is present - **WHEN** 后台 `docs_link`
      配置为外部 URL - **THEN** 首页 Hero 的“文档”按钮 MUST 仍导航到站内 `/docs` - **AND** 该按钮
      MUST NOT 打开外部地址或新标签页。
    result: passed
    reason:
      text: 外部 docs_link 配置不会覆盖 Hero CTA；单测与浏览器均确认内部 href、无 target 并导航到 /docs。
      truncated: false
  - id: A7
    source: specs/home-docs-navigation/spec.md
    text: Other documentation links remain scoped - **WHEN**
      页面包含顶部站内接入文档入口或明确的项目介绍、安装指南、第三方参考链接 - **THEN** 顶部站内入口 MUST 继续导航到 `/docs` -
      **AND** 其它具体外部参考链接 MUST 保持原有目标和外部链接语义。
    result: passed
    reason:
      text: 静态复核确认顶部站内入口继续为 /docs，Hero 与 footer 的具体外链保持原有外链语义。
      truncated: false
  - id: A8
    source: specs/home-docs-navigation/spec.md
    text: 首页 Hero 文档按钮 MUST 使用类型安全的 TanStack Router `Link`。
    result: passed
    reason:
      text: Hero 从 @tanstack/react-router 导入 Link，并使用字面量类型安全目标 <Link to='/docs' />。
      truncated: false
  - id: A9
    source: specs/home-docs-navigation/spec.md
    text: 首页 Hero 文档按钮 MUST NOT 依赖 `status.docs_link`。
    result: passed
    reason:
      text: 候选删除 useStatus 导入、status 解构、docsUrl 与 docsButton 分支；Hero 中无 docs_link
        残留，测试还断言 hook 未调用。
      truncated: false
  - id: A10
    source: specs/home-docs-navigation/spec.md
    text: 首页 Hero 文档按钮 MUST NOT 使用 `window.location`、裸内部 `href`、`target="_blank"`
      或其它强制整页跳转。
    result: passed
    reason:
      text: Hero Docs CTA 未使用 window.location、document.location、裸内部 href 或
        target=_blank；保留的 target 仅属于明确外链。
      truncated: false
  - id: A11
    source: specs/home-docs-navigation/spec.md
    text: 该导航行为 MUST 有真实 Router 点击回归和浏览器验收。
    result: passed
    reason:
      text: 独立重跑真实 TanStack Memory Router Vitest：1 file、2 tests passed；主代理 Playwright
        点击验收 href、target、pathname 与无页面/控制台错误均通过。
      truncated: false
  - id: A12
    source: specs/home-docs-navigation/spec.md
    text: "`/docs` 页面内容、权限和后端契约 MUST 保持不变。"
    result: passed
    reason:

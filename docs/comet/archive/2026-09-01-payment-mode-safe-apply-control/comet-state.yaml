  - id: A1
    source: brief.md
    text: "A9: 合法模式保存时数据库写入失败返回失败，数据库值、OptionMap 和 effective mode 均不变，且不触发退出。"
    result: passed
    reason:
      text: Database write failures preserve the persisted value, OptionMap and frozen
        effective mode and do not trigger shutdown.
      truncated: false
  - id: A2
    source: brief.md
    text: "A10: Root 可选择“仅保存”或“保存并应用”；非 Root 无法读取状态或调用应用接口。"
    result: passed
    reason:
      text: Root users have distinct save-only and save-and-apply paths; the status
        and apply routes are Root-only.
      truncated: false
  - id: A3
    source: brief.md
    text: "A11: capability 未启用、平台不支持、实例检测失败或活跃实例不为一时，不提供可执行应用按钮，只显示手工重启提示。"
    result: passed
    reason:
      text: Disabled capability, unsupported shutdown, instance-check failures and
        non-single-instance states fail closed and leave only manual-restart
        guidance.
      truncated: false
  - id: A4
    source: brief.md
    text: "A12: 应用必须二次确认；重复点击、目标变化、已生效或已有操作时只返回确定状态，不重复退出。"
    result: passed
    reason:
      text: The UI requires confirmation and locks pending submissions; server-side
        idempotency, target checks and operation guards prevent duplicate
        shutdown scheduling.
      truncated: false
  - id: A5
    source: brief.md
    text: "A13: 应用 API 只接受固定模式、预期状态和幂等标识，不接受自由目标或命令。"
    result: passed
    reason:
      text: The apply endpoint uses strict fixed-schema JSON decoding and rejects
        unknown fields and trailing data.
      truncated: false
  - id: A6
    source: brief.md
    text: "A14: desired 持久化、审计和响应准备完成后才异步触发当前进程 graceful shutdown，由 supervisor 拉起。"
    result: passed
    reason:
      text: Desired persistence, synchronous audit, response preparation and the
        asynchronous current-process graceful-shutdown trigger occur in the
        required order.
      truncated: false
  - id: A7
    source: brief.md
    text: "A15: 页面在断连期间重试轮询，只有新 `started_at`、健康、effective==desired
      且单实例时显示成功，否则失败/手工处理。"
    result: passed
    reason:
      text: Recovery uses bounded polling with retries for transient 502/503/network
        failures and does not report success from a stale or failed query.
      truncated: false
  - id: A8
    source: brief.md
    text: "A16: 当前站点隔离数据库中的第二个活跃实例、stale/未知状态或查询错误会拒绝应用，不报告混合生效。"
    result: passed
    reason:
      text: Unknown, stale, missing or multiple active instances fail closed and
        cannot be reported as a safe single-instance apply.
      truncated: false
  - id: A9
    source: brief.md
    text: "A17: 触发路径只结束当前应用进程，不影响 PostgreSQL、Redis、EPUSDT/GMPay 或另一站点。"

  - id: A11
    source: specs/payment-gateway-mode/spec.md
    text: 同一代码基线支持 `epay_legacy` 和 `gmpay_native`
      两种互斥支付模式。模式由当前站点隔离数据库提供，在进程启动时读取并冻结；运行期间不热切换。Root 管理员可保存 desired
      mode，并在显式启用且证明安全的单实例部署中保存并应用。
    result: passed
    reason:
      text: Only epay_legacy and gmpay_native are accepted, and the effective mode is
        frozen during startup before the HTTP listener is started.
      truncated: false
  - id: A12
    source: specs/payment-gateway-mode/spec.md
    text: Web 应用只结束自身进程，复用现有 graceful shutdown；外部 supervisor
      负责重新拉起。任何数据库、Redis、支付网关、另一站点、容器、主机或命令控制均不在 API 能力范围内。
    result: passed
    reason:
      text: The implementation has no capability to control another workload, site,
        database, Redis, gateway, container, host or external command.
      truncated: false
  - id: A13
    source: specs/payment-gateway-mode/spec.md
    text: "`PaymentGatewayMode` 只接受 `epay_legacy` 和 `gmpay_native`，不存在或为空时使用
      `epay_legacy`。"
    result: passed
    reason:
      text: PaymentGatewayMode normalization accepts only the two documented modes and
        defaults an empty or missing persisted value to legacy.
      truncated: false
  - id: A14
    source: specs/payment-gateway-mode/spec.md
    text: 初始化数据库和 Options 后校验并冻结 effective mode；非法值在 HTTP listener 启动前失败，错误不得泄漏凭据。
    result: passed
    reason:
      text: An invalid persisted mode fails during initialization before the HTTP
        listener starts, without exposing credentials.
      truncated: false
  - id: A15
    source: specs/payment-gateway-mode/spec.md
    text: 所有下单、公开支付能力、回调和模板使用 effective mode，不根据 Host、转发头、请求参数或系统名称推断。
    result: passed
    reason:
      text: Top-up, webhook, subscription, group-buy and agent-payment paths select
        behavior from the frozen effective mode rather than host, headers or
        request parameters.
      truncated: false
  - id: A16
    source: specs/payment-gateway-mode/spec.md
    text: 保存 desired 不改变当前 effective；只有新进程重新加载后生效。
    result: passed
    reason:
      text: Saving desired mode persists the target without changing the running
        effective mode; a new process must reload it.
      truncated: false
  - id: A17
    source: specs/payment-gateway-mode/spec.md
    text: "`EffectivePaymentGatewayMode` 为只读运行状态，通用 Option PUT 不得写入。"
    result: passed
    reason:
      text: EffectivePaymentGatewayMode is exposed as read-only runtime state and
        generic option writes reject that key.
      truncated: false
  - id: A18
    source: specs/payment-gateway-mode/spec.md
    text: "`UpdateOption` 必须逐层返回查询、`FirstOrCreate` 和 `Save` 错误；任何数据库失败都不得更新
      OptionMap。"
    result: passed
    reason:
      text: UpdateOption and related option transactions propagate query, create and
        save errors and update OptionMap only after a successful database
        transaction.
      truncated: false
  - id: A19
    source: specs/payment-gateway-mode/spec.md
    text: 提供 Root-only 状态接口，返回
      desired、effective、`started_at`、自重启能力、单实例资格、当前操作状态和不可用原因，不返回密钥或部署细节。
    result: passed
    reason:
      text: The Root-only status response exposes bounded desired/effective state,
        started_at, capability, operation and reason fields without secrets or
        deployment details.
      truncated: false
  - id: A20
    source: specs/payment-gateway-mode/spec.md
    text: 提供 Root-only“保存并应用”接口。请求只允许目标模式枚举、预期 effective/desired 值和幂等 request
      ID；未知字段、容器/服务/主机/URL/命令/信号/数据库/Redis/网关参数一律拒绝。
    result: passed
    reason:
      text: The Root-only apply API accepts only the target mode, expected
        effective/desired values and request ID; deployment and command
        parameters are rejected.
      truncated: false
  - id: A21
    source: specs/payment-gateway-mode/spec.md
    text: 服务器重新读取状态并执行乐观校验。目标已变化、effective 已等于目标、请求重复、已有操作或 capability
      丢失时返回确定状态且不重复触发。
    result: passed
    reason:
      text: The server re-reads optimistic state and uses a durable Options

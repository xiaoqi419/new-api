acceptance:
  - id: A1
    source: brief.md
    text: 在浅色或深色模式打开 `/dashboard`、管理设置页或其他业务页时，背景、卡片、按钮、hover、focus
      ring、侧栏、表格、骨架屏、概览卡和图表均来自蓝/青/中性业务 palette，不显示旧玫瑰或梅粉主题色。
    result: passed
    reason:
      text: 完整业务 token 链已指向蓝/青/中性 business palette，未发现旧玫瑰或梅粉通用主题色。
      truncated: false
  - id: A2
    source: brief.md
    text: 仪表盘存在多条模型序列时，Canvas 图表使用可区分的蓝、青、绿、紫和琥珀辅助序列，不以粉/玫瑰作为主序列色，并保留循环扩展行为。
    result: passed
    reason:
      text: Dashboard 多序列 palette 使用蓝、青、绿、紫、琥珀等十个可区分颜色，并保留循环分配。
      truncated: false
  - id: A3
    source: brief.md
    text: 模型详情吞吐图的序列色与浅色/深色卡片描边跟随当前业务 palette，不再使用旧粉色 `--chart-1` 或旧粉色卡片色。
    result: passed
    reason:
      text: 模型详情图表使用业务蓝主序列与浅/深业务卡片描边，旧粉色序列和描边已移除。
      truncated: false
  - id: A4
    source: brief.md
    text: 首页和登录页仍保持各自 scoped palette；品牌字标、厂商品牌图标、业务状态标签和管理员自定义粉色色卡没有被误删。
    result: passed
    reason:
      text: 首页与认证 scoped palette、品牌字标、厂商品牌色、状态语义色和管理员粉色 swatch 均保留。
      truncated: false
  - id: A5
    source: brief.md
    text: 390px 与 1440px 视口下业务页面无新增横向溢出、遮挡或不可操作状态。
    result: passed
    reason:
      text: Playwright light/dark × 1440/390 的 body/document scrollWidth 均与 viewport
        相等，无主题改动引入的横向溢出；真实数据 dashboard 视觉验证限制已记录在风险中。
      truncated: false
  - id: A6
    source: specs/business-theme/spec.md
    text: Light business shell - **WHEN** 用户以浅色模式打开仪表盘、管理页或普通业务页 - **THEN**
      背景、卡片、弹层、按钮、选中态、hover、focus ring 和侧栏使用白色、中性灰、蓝色或青色业务 token - **AND**
      表格表头、禁用行和骨架屏使用中性业务层级 - **AND** 不显示旧玫瑰主色、浅粉表面或梅粉描边
    result: passed
    reason:
      text: 浅色背景、卡片、primary/ring、accent、sidebar、表格和 skeleton 均解析为白色、中性或蓝青业务值。
      truncated: false
  - id: A7
    source: specs/business-theme/spec.md
    text: Dark business shell - **WHEN** 用户以深色模式打开仪表盘、管理页或普通业务页 - **THEN**
      背景、卡片、弹层和侧栏使用中性黑灰层级，交互强调使用蓝色或青色 - **AND** 表格、骨架屏、图表与分类标签在深色表面可辨识 - **AND**
      不显示旧深梅背景、粉色强调或粉色焦点环
    result: passed
    reason:
      text: 深色背景、卡片、sidebar、表格和 skeleton 使用中性黑灰层级，交互强调使用蓝青值。
      truncated: false
  - id: A8
    source: specs/business-theme/spec.md
    text: Multi-series dashboard chart - **WHEN** 仪表盘绘制一个或多个模型序列 - **THEN**
      第一个序列使用业务蓝色 - **AND** 后续序列使用可区分的非粉色辅助 palette - **AND** 超过 palette
      长度时继续按既有循环规则稳定分配颜色
    result: passed
    reason:
      text: Dashboard palette 回归测试验证首序列业务蓝、十色非粉 palette 和超过长度后的稳定循环。
      truncated: false
  - id: A9
    source: specs/business-theme/spec.md
    text: Model detail chart - **WHEN** 模型详情页面绘制吞吐量或可用率图表 - **THEN** 吞吐量主序列使用与当前业务图表
      token 一致的蓝色 - **AND** 点描边使用当前浅色或深色业务卡片颜色 - **AND** 成功率等业务状态仍使用对应
      success、warning、destructive 语义
    result: passed
    reason:
      text: 模型详情图表源码和回归测试验证业务蓝主序列、主题卡片描边及 success/warning/destructive 语义。
      truncated: false
  - id: A10
    source: specs/business-theme/spec.md
    text: Marketing and authentication surfaces - **WHEN** 用户打开首页或登录/注册页 - **THEN**
      首页继续使用 `--home-*` palette - **AND** 认证 surface 继续按现有 scoped 规则继承首页 token -
      **AND** 业务主题变更不覆盖这些 scoped aliases
    result: passed
    reason:
      text: theme-presets.css 的 home/auth scoped surface 与 theme.css 的 home token 未被业务
        alias 覆盖。
      truncated: false
  - id: A11
    source: specs/business-theme/spec.md
    text: Legitimate brand and classification colors - **WHEN**
      页面展示品牌字标、厂商/支付图标、管理员自定义颜色或显式分类 badge - **THEN** 这些颜色保持原有品牌或分类语义 - **AND**
      主题清理不得通过全局字符串替换删除或改写它们
    result: passed
    reason:
      text: 品牌、供应商、支付、管理员自定义和显式分类色按原语义保留，未做全局 pink 字符串替换。
      truncated: false
  - id: A12
    source: specs/business-theme/spec.md
    text: 所有未声明首页或认证 scoped surface 的业务页面 MUST 使用完整的蓝/青/中性 `--business-*`
      palette。通用主题 token MUST 覆盖基础表面、交互状态、侧栏、图表、分类标签、概览强调、骨架屏和表格层级，不得回退到旧粉色
      palette。
    result: passed
    reason:
      text: 通用基础、交互、sidebar、chart、tag、overview、skeleton、table token 均完整别名到 business
        palette。
      truncated: false
  - id: A13
    source: specs/business-theme/spec.md
    text: CSS 图表 token 和无法读取 CSS 变量的 Canvas/VChart palette MUST 与业务主题保持一致。主序列 MUST
      使用蓝或青；多序列 MAY 使用绿、紫和琥珀等辅助色维持区分，但 MUST NOT 以粉、玫瑰或梅色作为主题序列。
    result: passed
    reason:
      text: CSS chart/tag token 与 Canvas/VChart 显式色值均同步业务蓝青中性主题，旧粉色主题序列无残留。
      truncated: false
  - id: A14
    source: specs/business-theme/spec.md
    text: 首页、认证页、品牌资产和显式数据分类色 MUST 保持其独立视觉语义，不得因业务主题清理被全局重写。
    result: passed
    reason:
      text: 首页、认证页、品牌资产和数据分类色的独立视觉语义保持不变。
      truncated: false
  - id: A15
    source: specs/business-theme/spec.md
    text: 业务 CSS token 由 `web/src/styles/theme.css` 集中定义和别名；`theme-presets.css`
      只继续负责排版轴与 scoped home/auth surface。
    result: passed
    reason:
      text: theme.css 集中定义业务色与 generic aliases，theme-presets.css 保持排版轴和 scoped surface
        职责。
      truncated: false
  - id: A16
    source: specs/business-theme/spec.md
    text: Canvas/VChart 不能读取 CSS 变量的色值可在对应模块维护显式浅色/深色值，但注释和测试必须说明其与业务 token 的对应关系。
    result: passed
    reason:
      text: Dashboard、performance metrics、model details 的显式 Canvas/VChart 色值均有业务 token
        对应注释与测试。
      truncated: false
  - id: A17
    source: specs/business-theme/spec.md
    text: 不增加具名颜色预设或 `data-theme-color`，不恢复已删除的主题抽屉。
    result: passed
    reason:
      text: 源码未发现 data-theme-color、themeColor 或 colorPreset，未恢复具名颜色预设或主题抽屉。
      truncated: false
  - id: A18
    source: specs/business-theme/spec.md
    text: 测试文件必须位于对应模块的 `__tests__/` 目录，并保护用户可见的 token/palette 契约。
    result: passed
    reason:
      text: 新增回归测试均位于对应模块 __tests__ 目录，直接保护 token、palette 和图表行为契约。
      truncated: false

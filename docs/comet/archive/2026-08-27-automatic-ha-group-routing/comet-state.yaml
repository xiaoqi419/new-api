  - id: A26
    source: specs/automatic-ha-group-routing/spec.md
    text: 渠道监控必须在现有按渠道、模型、小时聚合中同时汇总缓存列。观察缓存率是所选窗口内 `SUM(read) / SUM(input)`；未来 24
      小时预测固定使用最近 7 天小时桶，令 `weight = 2^(-age_hours/24)`，计算 `SUM(weight * read) /
      SUM(weight * input)`。至少需要 20 个有效成功请求、10,000 输入 Token、3 个活跃小时和正缓存能力证据；否则返回
      `null`、支持度 `none` 和结构化不足原因。渠道汇总只合并有缓存证据模型并按 Token 加权，不对模型百分比求平均。

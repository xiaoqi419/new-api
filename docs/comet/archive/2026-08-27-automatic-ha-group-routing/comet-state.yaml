      `Channel.GetGroups()` 精确属于目标分组。池配置通过一个 ConfigManager/Option JSON
      字段原子保存并热应用，不新增调度池数据库表。
    result: passed
    reason:
      text: Pool definitions are atomically persisted and typed validation supports
        stale-member cleanup.
      truncated: false
  - id: A21
    source: specs/automatic-ha-group-routing/spec.md
    text: 一个实际分组只要存在至少一个启用池就进入受管模式。固定分组同步文本请求的首次候选只能来自该分组全部启用池渠道白名单的并集，并继续过滤启用状态、原始模型和请求路径；首次选中渠道后，系统锁定其所属池和
      `Channel.Type`，后续重试只在该池内进行。未勾选渠道不得进入普通首次选路或故障切换；全部启用池都没有可用成员时必须 fail
      closed。没有启用池的分组保持原版选路。未勾选渠道仍可保持启用并用于未受这些池管理的其他分组或指定渠道操作。
    result: passed
    reason:
      text: Managed routing is allowlist-only and fails closed when listed members are
        ineligible.
      truncated: false
  - id: A22
    source: specs/automatic-ha-group-routing/spec.md
    text: 首次选路继续使用池内渠道现有 Priority、Weight、fallback、多 Key、模型匹配和请求路径过滤。首次选中的实际分组、原始模型、池
      ID 和 `Channel.Type` 是本次请求不可变边界。当 A
      在响应首字节前出现允许切换的配置状态码、自动禁用状态码、错误关键词、连接错误或超时时，且 `RetryTimes` 仍有预算，系统把 A
      加入请求内失败集合，并从池内剩余合格成员的最高优先级档重新选择。全局 retry 序号不得跳过可用主备渠道，失败渠道不得在同一请求再次选中。
    result: passed
    reason:
      text: Priority, weight, fallback, pool locking, and failed-member exclusion are
        preserved.
      truncated: false
  - id: A23
    source: specs/automatic-ha-group-routing/spec.md
    text: 系统不得为本功能选择其他实际分组，即使另一分组倍率数值相同，也不得选择不同 `Channel.Type`。计费一致性通过固定 `using
      group + origin model` 保证，不新增渠道倍率字段或浮点倍率比较。新池逻辑不得推进原版 GroupSwitch

acceptance:
  - id: A1
    source: brief.md
    text: A1：国际站主价格源返回 HTTP 429 时，受支持的 GMPay 网络在一次受控请求内自动尝试备用源；备用源返回匹配资产、USD/CNY
      和新鲜时间戳时，状态恢复为可估算，quote 的 `PriceSource` 标明备用主机。
    result: passed
    reason:
      text: 独立验证确认 CoinGecko 失败后按固定 api.coinpaprika.com HTTPS 白名单回退，来源正确写入
        quote.Evidence.PriceSource；429 回退测试通过。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：备用源响应的资产、币种、数值或时间戳缺失/不匹配/过期时，估算继续 fail-closed，不创建零费用或负费用订单。
    result: passed
    reason:
      text: CoinPaprika 现在强制校验固定 network id、native symbol、quotes 对象、所选 USD/CNY quote 及
        price 标量，并执行正数/范围/时间戳 freshness 校验；缺少 quotes、币种或 quote price（包括顶层 price
        绕过）均 fail-closed，回归测试通过。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：连续的同网络/币种/结算币种估算在短缓存 TTL 内只产生一次行情请求；缓存命中仍受严格价格最大年龄和 quote TTL
      约束，过期后重新取源。
    result: passed
    reason:
      text: 独立验证确认 15 秒有界价格缓存、每次命中 freshness/TTL 重检、容量上限及 singleflight
        并发合并；调用方取消不会取消共享请求，缓存/并发测试通过。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：现有 TRON/EVM/Solana 链上估算、金额不变量、回调幂等和 Legacy EPay 行为保持不变；管理员无需新增配置。
    result: passed
    reason:
      text: 改动仅限内置行情抓取、解析、缓存和回归测试/changelog；TRON/EVM/Solana RPC、金额、回调幂等、Legacy
        EPay、数据库/Redis/支付网关均未改变，受影响包测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：聚焦 Go 测试覆盖主源限流回退、备用源解析、缓存及 fail-closed 边界；相关前端/构建检查不因本修复回归。
    result: passed
    reason:
      text: 独立 focused/affected Go 测试、控制器回归、gofmt、git diff --check 及 web lint
        均通过；前端逻辑未改，typecheck/build 已由同候选记录并通过。
      truncated: false

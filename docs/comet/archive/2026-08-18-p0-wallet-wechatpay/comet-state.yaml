acceptance:
  - id: A1
    source: brief.md
    text: "A1: `wechatpay` 进入专用微信 processor；`wxpay` 仍进入 generic 易支付 processor。"
    result: passed
    reason:
      text: wechatpay uses the dedicated processor while wxpay remains on the generic
        processor.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 微信内浏览器且 JSAPI 开启时调用 `/api/user/wechatpay/jsapi/prepare` 并安全跳转
      `authorize_url`。"
    result: passed
    reason:
      text: WeChat browser JSAPI selection, prepare endpoint, safe authorize_url
        validation, and navigation are implemented and tested.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 外部移动浏览器且 H5 开启时调用 `/api/user/wechatpay/pay`，`scene=h5`，并安全跳转
      `h5_url`。"
    result: passed
    reason:
      text: External mobile H5 selection, scene=h5 request, safe h5_url validation,
        and navigation are implemented and tested.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 桌面浏览器或可用降级场景且 Native 开启时调用
      `/api/user/wechatpay/pay`，`scene=native`，展示二维码并保留 `trade_no`。"
    result: passed
    reason:
      text: Native fallback sends scene=native, requires qr_code and trade_no, and
        opens the existing WeChat QR dialog.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 当前环境没有可用微信支付场景时，不创建订单，显示失败提示。"
    result: passed
    reason:
      text: No usable enabled scene fails before any payment endpoint is called.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Native 二维码复用现有 `PaymentQrDialog`，通过
      `/api/user/topup/status?trade_no=...` 轮询并在成功后刷新余额。"
    result: passed
    reason:
      text: The existing PaymentQrDialog polls topup status and refreshes the wallet
        after successful WeChat payment.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 非 `http`/`https` 的 H5 或 JSAPI 地址被拒绝，不发生浏览器跳转。"
    result: passed
    reason:
      text: Redirects require absolute http or https URLs with an authority; unsafe
        values are rejected without navigation.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 微信能力字段参与充值入口可用性和最小充值金额判断，空值和错误响应可见地失败。"
    result: passed
    reason:
      text: WeChat capability flags gate availability and scene selection, per-method
        minimums remain enforced, and empty/error responses are visible.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: 受影响测试、TypeScript 类型检查、lint 和生产构建通过。"
    result: passed
    reason:
      text: 25 focused tests, changed-file lint, typecheck, production build, and root
        Go build passed; repository-wide lint failures are pre-existing outside
        this change.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: changelog 有最新中文用户可读条目，版本格式与本轮提交短 SHA 一致。"
    result: passed
    reason:
      text: The newest changelog entry is Chinese, user-readable, dated 2026-08-18,
        and uses version 20260818-ab791b03a matching the feature short SHA.
      truncated: false

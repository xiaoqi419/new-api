        usage, terminal handling, error handling, cancellation, and HTTP
        fallback behavior.
      truncated: false
  - id: A15
    source: specs/channel-upstream-websocket/spec.md
    text: deterministic fixture 覆盖稳定会话的连接复用、`previous_response_id`
      粘性、不同会话隔离、连接失效淘汰、发送前安全重建、发送后禁止重放和单连接串行 lease。
    result: passed
    reason:
      text: Deterministic fixtures cover stable session reuse, previous_response_id
        stickiness, session isolation, failed connection eviction, safe rebuild
        before send, no replay after send, and single-connection serial leasing.
      truncated: false
  - id: A16
    source: specs/channel-upstream-websocket/spec.md
    text: 真实测试 CPA 验证规范 `/v1/responses` WS 路由、`response.create`、Responses 事件和
      usage，并确认 new-api 客户端仍收到 `text/event-stream` SSE；实现保留 `/v1/responses/ws` 与
      `/v1/ws` 兼容探测。
    result: passed
    reason:

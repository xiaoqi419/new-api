acceptance:
  - id: A1
    source: brief.md
    text: A1：钱包选择任一 Epay 聚合支付方式并确认后，当前页面打开支付 Modal，Modal 内展示二维码，浏览器不打开新标签页也不离开当前页面。
    result: passed
    reason:
      text: The default wallet Epay entry opens the in-site checkout dialog and the
        focused regressions prove that the Epay path does not open a popup,
        submit a form, or navigate away.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：订阅选择 Epay 并确认后，当前订阅购买上下文切换到支付 Modal，浏览器不发生外部导航。
    result: passed
    reason:
      text: The subscription Epay entry normalizes checkout state in the current
        subscription context without external navigation.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：拼团创建或参团选择 Epay 后，当前页面打开支付 Modal；即使响应为兼容的 `pay_url` 形态，也只将其编码为 Modal
      二维码，不自动外跳。
    result: passed
    reason:
      text: Default and classic group-buy create and join flows normalize compatible
        pay_url responses into modal checkout data rather than navigating to
        them.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：default 与 classic 两套仍发布的用户界面在 A1-A3 行为上保持一致，相关 Epay 发起分支不存在
      `window.open`、`window.location` 或自动表单提交。
    result: passed
    reason:
      text: Both published frontend implementations use dedicated Epay checkout
        normalizers and dialogs; remaining window navigation is confined to
        explicitly non-Epay providers.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：支付成功、失败、过期、轮询超时、手动刷新、重试和关闭行为保持可用；关闭未支付拼团仍释放预占名额。
    result: passed
    reason:
      text: Default and classic dialogs implement success, failure, expiry, timeout,
        manual refresh, retry, close, timer cleanup, and unpaid group
        reservation release.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：无可安全展示的 checkout 值时，界面显示本地化错误并停留当前页面，不以外部导航作为降级方案。
    result: passed
    reason:
      text: Unsafe or incomplete checkout data is rejected with a localized error
        while the user stays on the current page.
      truncated: false
  - id: A7
    source: brief.md
    text: A7：受影响的定向前端测试、类型检查、涉及文件 lint 和生产构建通过；后端契约若有改动，其定向 Go 测试通过。
    result: passed
    reason:
      text: Runtime evidence records passing focused default/classic tests, TypeScript
        typecheck, targeted lint, production build, backend payment tests,
        static no-navigation review, and diff validation.
      truncated: false
  - id: A8
    source: specs/epay-in-site-checkout/spec.md
    text: 普通用户侧所有由彩虹易支付（Epay）处理的钱包充值、订阅购买、拼团创建和参团入口，发起付款后必须留在当前业务页面，在 Modal
      中直接展示二维码、金额、支付方式、站内订单号和支付状态。发起动作不得自动打开新标签页、替换当前页面、提交外部表单或通过链接导航到网关页面。
    result: passed
    reason:
      text: The shared checkout dialog renders QR content, amount, payment method,
        trade number, and observed status in the current page without external
        navigation.
      truncated: false
  - id: A9
    source: specs/epay-in-site-checkout/spec.md
    text: default 与 classic 两套仍发布的前端必须保持一致。当前至少覆盖 Epay 的 `alipay` 与
      `wxpay`；支付宝官方商户直连、微信官方商户直连、Stripe、Creem、Waffo 和代理控制台预充值保持各自既有行为。
    result: passed
    reason:
      text: Epay methods remain separated from direct Alipay, direct WeChat, Stripe,
        Creem, Waffo, and agent prepayment behavior.
      truncated: false
  - id: A10
    source: specs/epay-in-site-checkout/spec.md
    text: 服务端标准成功响应继续使用 `trade_no`、可选
      `gateway_trade_no`、`checkout_type`、`checkout_value`、`payment_method` 和
      `money`。`checkout_type` 只允许 `qrcode`、`payurl` 或支付方式白名单允许的 `urlscheme`。
    result: passed
    reason:
      text: The backend returns the normalized checkout fields and constrains
        checkout_type to qrcode, payurl, or an allowed payment-method URL
        scheme.
      truncated: false
  - id: A11
    source: specs/epay-in-site-checkout/spec.md
    text: 前端收到标准 checkout 数据时，将 `checkout_value` 作为二维码内容。为兼容尚未升级或历史路径返回的 Epay
      `pay_url`/`qr_code`，只在能够确认订单号、支付方式、金额和安全 checkout 值时规范化为同一 Modal 数据；不得把
      `pay_url` 当作自动导航回退。缺少必要字段或值不安全时，显示本地化的支付请求失败提示并停留当前页面。
    result: passed
    reason:
      text: Standard and legacy Epay checkout values are normalized only when order,
        method, amount, and target safety checks pass; pay_url is never an
        automatic redirect fallback.
      truncated: false
  - id: A12
    source: specs/epay-in-site-checkout/spec.md
    text: Modal 使用现有 `qrcode.react` 生成二维码，不注入原始 HTML。桌面二维码约 240px，390px 窄屏约
      208px。Modal 打开后每 3 秒轮询本人订单状态，最长 5 分钟，并提供手动刷新：
    result: passed
    reason:
      text: Both dialogs use qrcode.react, display payment metadata, poll immediately
        and every three seconds within the bounded window, and support manual
        refresh.
      truncated: false
  - id: A13
    source: specs/epay-in-site-checkout/spec.md
    text: "`pending` 保持等待；"
    result: passed
    reason:
      text: Pending responses keep the dialog in the waiting state.
      truncated: false
  - id: A14
    source: specs/epay-in-site-checkout/spec.md
    text: "`success` 停止轮询并刷新相应余额、订阅或拼团详情；"
    result: passed
    reason:
      text: Success stops polling and refreshes the corresponding wallet,
        subscription, or group-buy state.
      truncated: false
  - id: A15
    source: specs/epay-in-site-checkout/spec.md
    text: "`failed`/`expired` 停止轮询并允许返回或重试；"
    result: passed
    reason:
      text: Failed and expired results stop polling and retain return or retry
        actions.
      truncated: false
  - id: A16
    source: specs/epay-in-site-checkout/spec.md
    text: 临时网络错误继续等待；
    result: passed
    reason:
      text: Temporary observation errors do not create a terminal payment state and
        polling continues within the configured limit.
      truncated: false
  - id: A17
    source: specs/epay-in-site-checkout/spec.md
    text: 观察超时仅停止自动轮询，不修改服务端订单状态。
    result: passed
    reason:
      text: Observation timeout stops only automatic polling, does not mutate server
        settlement state, and leaves manual refresh available.
      truncated: false
  - id: A18
    source: specs/epay-in-site-checkout/spec.md
    text: 组件卸载、主动关闭或订单更换时清理旧定时器。关闭未支付拼团 checkout
      时调用现有取消接口释放预占名额；取消保持幂等且不能影响已经由异步通知完成的订单。
    result: passed
    reason:
      text: Unmount, close, checkout replacement, and terminal results clear
        intervals; unpaid group checkout close uses the existing idempotent
        release path.
      truncated: false
  - id: A19
    source: specs/epay-in-site-checkout/spec.md
    text: 唯一结算入口仍是现有钱包、订阅和拼团 Epay 异步通知。前端响应、二维码、轮询结果、MAPI 成功响应和 return URL
      均不能自行入账、开通订阅或完成拼团。
    result: passed
    reason:
      text: Frontend checkout and polling remain observational; settlement remains
        exclusively in the existing verified Epay asynchronous notification
        handlers.
      truncated: false
  - id: A20
    source: specs/epay-in-site-checkout/spec.md
    text: "`payurl` 仅允许带有效主机名的绝对 `http/https` URL；`urlscheme` 只允许与支付方式匹配的明确白名单。禁止
      `javascript:`、`data:`、相对 URL、未知 scheme、空值和自动拉起 App。密钥、签名和敏感 checkout token
      不得进入浏览器响应或日志。"
    result: passed
    reason:
      text: Only absolute HTTP(S) payurl values with hosts and payment-method-matched
        URL schemes are allowed; javascript, data, relative, empty, and
        mismatched values are rejected.
      truncated: false
  - id: A21
    source: specs/epay-in-site-checkout/spec.md
    text: 本能力不新增数据库表、列或迁移，并保持 SQLite、MySQL 5.7.8+ 与 PostgreSQL 9.6+ 兼容。
    result: passed
    reason:
      text: The implementation adds no database table, column, migration, or
        dialect-specific database dependency.
      truncated: false
  - id: A22
    source: specs/epay-in-site-checkout/spec.md
    text: 前端定向测试必须覆盖钱包、订阅、拼团创建和参团在 default/classic 中打开 Modal，并断言发起 Epay 的代码路径没有调用
      `window.open`、`window.location.assign`/`href`
      或自动表单提交。继续覆盖二维码、轮询成功/失败/过期/超时、手动刷新、重试、返回、定时器清理与拼团取消。
    result: passed
    reason:
      text: Runtime evidence covers wallet, subscription, group-buy create/join,
        dialog, classic entry, status lifecycle, cleanup, cancellation, and no
        automatic Epay navigation.
      truncated: false
  - id: A23
    source: specs/epay-in-site-checkout/spec.md
    text: 运行受影响测试、TypeScript 类型检查、涉及文件 lint 和生产构建。若服务端兼容响应契约发生变化，补充并运行对应 Go
      定向测试。真实商户扫码扣款、异步通知公网可达、验签、到账和退款仍需在测试环境使用真实商户配置验收，不得用模拟结果替代。
    result: passed
    reason:
      text: Automated validation gates passed. The user explicitly reported successful
        real payment and explicitly waived refund verification; Runtime recorded
        that waiver while resolving the prior A23 blocker. This acceptance
        relies on that authorized scope decision and does not claim that a
        refund was executed or verified.
      truncated: false

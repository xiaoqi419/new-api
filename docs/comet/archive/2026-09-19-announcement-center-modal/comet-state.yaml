acceptance:
  - id: A1
    source: brief.md
    text: "A1: 管理端级别增加居中弹窗，可创建、保存和重新编辑；原四种级别及旧公告保持兼容，不新增数据表或字段。"
    result: passed
    reason:
      text: Modal level is validated, persisted without schema changes, exposed in
        admin form/table, and covered by create/update tests.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 登录用户进入应用后，仅已发布且发布时间已到的居中公告自动弹出；草稿、未来公告、下架公告不可在用户列表或详情中读取。"
    result: passed
    reason:
      text: Public list and detail queries exclude drafts and future announcements;
        admin queries retain them.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 弹窗参考用户截图采用宽居中面板、固定标题及底部、正文独立滚动和
      Markdown，底部只有“取消”“已阅”，关闭按钮/Escape/遮罩等同取消；手机无横向溢出，多条公告使用单弹窗切换，不叠加遮罩。"
    result: passed
    reason:
      text: Centered dialog is bounded and responsive with independently scrolling
        content and fixed footer actions.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 取消仅抑制本次页面生命周期的该公告，刷新/重新进入后仍提醒，当前菜单切换不立即重弹；只有“已阅”按账号、站点、公告 ID
      和发布时间持久化。同浏览器不同账号不串读，重新设置发布时间后再次提醒，普通内容编辑不强制重弹。"
    result: passed
    reason:
      text: Cancel is session-only while acknowledgement persists by origin, user,
        announcement, and publish version.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 打开小铃铛或访问详情不自动确认居中公告；详情提供“已阅”按钮，与弹窗确认共用状态。"
    result: passed
    reason:
      text: Modal acknowledgement is explicit and independent from regular
        announcement read state.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6:
      保留原侧边栏公告中心入口，不新增“查看全部公告”按钮；右上角面板显示标题、时间、省略摘要，点击跳转详情。中心支持分类、置顶优先、发布时间排序及分页\
      ，已阅公告仍可查看，不静默遗漏历史公告。"
    result: passed
    reason:
      text: Announcement center and compact notification summaries provide
        categorized, paginated entries without a view-all button.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 每条公告有独立详情链接，完整展示标题、分类、时间和 Markdown 正文；支持刷新、返回列表，无效或不可公开公告显示明确不可用状态。"
    result: passed
    reason:
      text: Standalone announcement detail route renders full Markdown and explicit
        acknowledgement.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 新文案覆盖七种语言，更新日志版本跟随构建；相关 API 权限、定时发布边界、关闭状态、导航和手机布局经独立验证通过。"
    result: passed
    reason:
      text: All newly introduced user-facing strings are present in all seven locale
        files after the verifier gap was fixed.
      truncated: false
  - id: A9
    source: specs/announcement-center/spec.md
    text: 管理员继续管理公告标题、分类、级别、Markdown 内容、发布时间、置顶和发布状态。级别在
      default/success/warning/error 基础上增加
      modal（居中弹窗）；不自动修改既有记录，也不新增表结构。管理列表可识别该级别。
    result: passed
    reason:
      text: Modal API requests published, scheduled, modal-level announcements through
        the public paginated endpoint.
      truncated: false
  - id: A10
    source: specs/announcement-center/spec.md
    text: 公告仅在 published=true 且 publish_time
      不晚于服务器当前时间时对用户公开。公开列表、详情与居中提醒遵守同一条件；下架和草稿不得通过直接链接读取。管理端仍可读取所有记录。
    result: passed
    reason:
      text: Sorting, filtering, pagination, and publish-time gating are covered by
        backend tests.
      truncated: false
  - id: A11
    source: specs/announcement-center/spec.md
    text: 默认前端已登录区域读取到公开的 modal
      公告后，向尚未确认该版本的用户展示宽居中对话框。多条公告按置顶优先及发布时间倒序在一个对话框中阅读/切换。标题及底部固定，正文独立滚动，支持
      Markdown、站点主题与手机适配。底部只有“取消”和“已阅”，右上角关闭、Escape、遮罩关闭均等同取消。
    result: passed
    reason:
      text: Dialog close, Escape, overlay, and Cancel dismiss only the active modal
        for the mounted session.
      truncated: false
  - id: A12
    source: specs/announcement-center/spec.md
    text: 账号 ID、浏览器当前站点、公告 ID
      和发布时间组成持久化记录范围。只有显式点击“已阅”才持久化确认，刷新/重新登录同账号不重复提醒；取消仅在当前页面生命周期临时隐藏对应公告，菜单切换不立即重弹，刷新或重新进入仍提醒。切换账号不共享状态。只修改内容不自动重弹，更新发布时间并发布产生新提醒。记录仅保存于本浏览器，不承诺跨设备同步。打开小铃铛或详情都不自动确认居中公告，详情页提供已阅操作。
    result: passed
    reason:
      text: Dialog queue renders one announcement surface at a time with queue state.
      truncated: false
  - id: A13
    source: specs/announcement-center/spec.md
    text: 复用 /announcements
      及原侧边栏入口，不新增“查看全部公告”按钮。小铃铛面板改为标题、时间和省略摘要列表，点击公告进入详情。中心提供全部/系统/版本/活动分类、标题与摘要列表、时间与置顶状态、分页。可查看历史已阅公告；通过分页覆盖全部公开公告而非只展示最近固定数量。
    result: passed
    reason:
      text: Desktop, mobile, light, and dark browser checks passed with no overflow or
        runtime errors.
      truncated: false
  - id: A14
    source: specs/announcement-center/spec.md
    text: 列表标题进入 /announcements/$id 独立详情页面，正文完整渲染
      Markdown，含标题、分类和发布时间，支持直接刷新与返回中心。不存在或已不可公开的记录显示不可用提示，不泄漏草稿。已有时间线可保留并链接到对应详情。
    result: passed
    reason:
      text: Detail navigation does not auto-acknowledge; explicit detail
        acknowledgement works and republished versions reappear.
      truncated: false
  - id: A15
    source: specs/announcement-center/spec.md
    text: 使用项目既有组件与安全 Markdown 渲染，覆盖七语言和更新日志。范围为默认 React 前端及共享公告 API；classic 和独立 H5
      不重做。配置不触及计费和渠道；不新增邮件、短信或跨设备已读存储。
    result: passed
    reason:
      text: Changelog, documentation, locale synchronization, typecheck, build,
        lint/format, backend tests, focused Vitest tests, and browser checks are
        complete.
      truncated: false

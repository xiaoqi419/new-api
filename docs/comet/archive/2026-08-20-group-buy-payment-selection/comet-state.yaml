acceptance:
  - id: A1
    source: brief.md
    text: 仅启用一个有效 Epay 方法时，发起页和参团页都显示该方法并默认选中，提交 payload 包含对应 `payment_method`。
    result: passed
    reason:
      text: 发起与参团共享 hook，初始值为空，专用 info 返回后选择首个规范化方法；Vitest 与浏览器证据验证默认值和 Create/Join
        payload。
      truncated: false
  - id: A2
    source: brief.md
    text: 同时启用官方微信、官方支付宝和 Epay 时，用户能在真实 Base UI Select 中切换，触发器文本随选择更新，Create/Join
      使用最后选择的值。
    result: passed
    reason:
      text: 两个真实 Base UI Select 都绑定 payWay 并显示当前标签；组件测试和浏览器验收确认可在官方微信、官方支付宝与 Epay 间切换。
      truncated: false
  - id: A3
    source: brief.md
    text: 后端方法列表包含空项或重复类型时，前端只保留首个有效唯一项。
    result: passed
    reason:
      text: 后端和前端都修剪空白、丢弃空项并按 type 保留首个唯一方法，且均有回归测试。
      truncated: false
  - id: A4
    source: brief.md
    text: 只有 Stripe、Creem、Waffo、Waffo Pancake
      或余额方法时，拼团接口不把它们作为可用方式，页面显示“没有可用的支付方式”并且不能提交。
    result: passed
    reason:
      text: 后端显式排除 Stripe、Creem、Waffo、Waffo Pancake 和余额；两个入口在零方法时显示已国际化空态并禁用选择与提交。
      truncated: false
  - id: A5
    source: brief.md
    text: 支付合规未确认或没有配置拼团支持的网关时，支付列表为空且 UI 不保留 `wechatpay` 伪选择。
    result: passed
    reason:
      text: 所有 provider availability 都受当前支付合规确认约束；功能关闭、合规未确认或无可执行网关时返回空列表，hook 不保留虚假
        wechatpay。
      truncated: false
  - id: A6
    source: brief.md
    text: 客户端伪造保留方法或空方法调用 Create/Join 时，后端在创建拼团订单前拒绝请求。
    result: passed
    reason:
      text: Create/Join 在任何订单持久化前修剪并解析 payment_method；nil DB 回归测试证明空白和保留方法会提前拒绝。
      truncated: false
  - id: A7
    source: specs/group-buy-payment-methods/spec.md
    text: Supported payment methods are advertised - **WHEN** 支付合规已确认，且官方微信、官方支付宝或一个
      Epay 方法已完整启用 - **THEN** `/api/user/groupbuy/info` 的 `payment_methods`
      只包含当前拼团 dispatcher 能下单的方法 - **AND** 每个方法包含非空且唯一的 `type` 和可展示的 `name`。
    result: passed
    reason:
      text: GetGroupBuyInfo 始终返回 payment_methods；生成器只包含当前 dispatcher
        可执行且已启用的官方微信、官方支付宝和 Epay，矩阵测试通过。
      truncated: false
  - id: A8
    source: specs/group-buy-payment-methods/spec.md
    text: Unsupported top-up providers are not advertised - **WHEN** 普通充值只启用了
      Stripe、Creem、Waffo、Waffo Pancake、余额或其他拼团 dispatcher 不支持的保留 provider -
      **THEN** 这些 provider 不出现在拼团 `payment_methods` 中 - **AND** Create/Join
      收到伪造的保留 provider 时在创建订单前拒绝请求。
    result: passed
    reason:
      text: 不支持的方法既不会发布，也会被 Create/Join 共用的 resolver 拒绝；测试覆盖空白、未知和全部保留 provider。
      truncated: false
  - id: A9
    source: specs/group-buy-payment-methods/spec.md
    text: Default and changed selection - **WHEN** 拼团页面收到一个或多个有效支付方式 - **THEN**
      当前选择为空或已失效时自动选择第一项 - **AND** 用户可通过支付方式 Select 切换到其他有效项 - **AND** Select
      触发器展示当前项名称 - **AND** Create/Join payload 使用用户最后选择的 `payment_method`。
    result: passed
    reason:
      text: setter 只接受当前有效方法；刷新后保留有效值，否则切到第一项。测试覆盖默认、切换、触发器标签和精确提交值。
      truncated: false
  - id: A10
    source: specs/group-buy-payment-methods/spec.md
    text: No supported payment method - **WHEN** 支付合规未确认、没有配置拼团支持的网关，或接口返回空方法列表 -
      **THEN** 当前选择保持为空 - **AND** 支付方式 Select 与 Create/Join 操作不可提交 - **AND**
      页面显示明确的已国际化不可用说明 - **AND** 不显示或提交虚假的 `wechatpay` 默认值。
    result: passed
    reason:
      text: 加载中或零方法时两个入口均禁用控件并展示已翻译说明；hook 防御性拒绝空白或过期选择，测试确认不发请求。
      truncated: false
  - id: A11
    source: specs/group-buy-payment-methods/spec.md
    text: Defensive list normalization - **WHEN** 客户端收到包含空类型、空名称或重复类型的拼团方法列表 -
      **THEN** 空项被丢弃 - **AND** 相同类型仅保留首个有效项 - **AND** 选择值始终属于规范化后的列表或为空。
    result: passed
    reason:
      text: normalizePaymentMethods 丢弃空 name/type、修剪并去重，选择状态始终属于规范化列表或为空，focused
        Vitest 直接覆盖。
      truncated: false
  - id: A12
    source: specs/group-buy-payment-methods/spec.md
    text: 拼团支付方式的后端接口 MUST 是当前可执行能力的唯一事实源。
    result: passed
    reason:
      text: 拼团前端只消费 getGroupBuyInfo；rg 未发现 group-buy 继续使用 topup
        info、getPayInfo、PayInfo 或旧 denylist。
      truncated: false
  - id: A13
    source: specs/group-buy-payment-methods/spec.md
    text: 普通充值 provider 的存在 MUST NOT 自动代表该 provider 支持拼团。
    result: passed
    reason:
      text: 后端通过显式 dispatcher-compatible 能力生成列表，前端只读取
        GroupBuyInfo.payment_methods，普通充值 provider 与拼团能力隔离。
      truncated: false
  - id: A14
    source: specs/group-buy-payment-methods/spec.md
    text: Create/Join MUST 在持久化订单之前拒绝空白、未知或保留的非拼团支付方式。
    result: passed
    reason:
      text: 共享 resolver 在 model.CreateGroupBuyOrder/JoinGroupBuyOrder
        前拒绝空白、未知、保留、未配置、未启用或不合规的方法。
      truncated: false
  - id: A15
    source: specs/group-buy-payment-methods/spec.md
    text: 前端 MUST 将有效用户选择原样写入 Create/Join `payment_method`。
    result: passed
    reason:
      text: Create 和 Join payload 都原样写入当前有效 payWay；focused Vitest 和浏览器验收验证 unionpay 与
        alipay_direct。
      truncated: false
  - id: A16
    source: specs/group-buy-payment-methods/spec.md
    text: 零可用方式 MUST 有明确空态并且不得发送 Create/Join 请求。
    result: passed
    reason:
      text: 两个入口都有明确、已翻译且不可提交的零方法状态，hook 还阻止程序化非法调用。
      truncated: false
  - id: A17
    source: specs/group-buy-payment-methods/spec.md
    text: 现有支付合规、provider mismatch、回调幂等和结算不变量 MUST 保持不变。
    result: passed
    reason:
      text: 静态调用链确认官方支付和 Epay 回调仍进入 TrySettleGroupBuyOrder，provider mismatch
        与成功状态幂等保持不变；相关 model 回归测试通过。
      truncated: false

acceptance:
  - id: A1
    source: brief.md
    text: 登录页在桌面端展示品牌面板和认证卡片，在窄屏展示无横向溢出的单栏布局。
    result: passed
    reason:
      text: Desktop split and 390px/320px single-column layouts pass without
        horizontal overflow.
      truncated: false
  - id: A2
    source: brief.md
    text: 桌面品牌面板以图形 Logo、去重后的大标题、配置描述或七语言默认描述、配置统计和无连线的 Claude/Codex/Gemini/40+
      模型横向带填充主视觉，不显示重复系统名称、轮廓字水印、模型拓扑、折线路由或中心网关图；模型名称只用于表达已支持的模型生态，不依赖真实
      provider 配置，也不代表登录 OAuth provider 数量；减少动态效果时场景保持清晰静态状态。
    result: passed
    reason:
      text: The desktop brand scene contains the icon-only mark, de-duplicated content
        and unconnected model rail without topology or watermark; reduced motion
        remains readable.
      truncated: false
  - id: A3
    source: brief.md
    text: 系统状态关闭某个 OAuth/Passkey/密码登录能力时，对应控件不显示，其他入口仍可用。
    result: passed
    reason:
      text: Password, Passkey and provider entry points remain conditional on
        SystemStatus.
      truncated: false
  - id: A4
    source: brief.md
    text: 用户可从登录页进入注册和忘记密码；登录表单提交仍调用既有 API，并保留 redirect 和 2FA 分支。
    result: passed
    reason:
      text: Registration, forgot-password, login API, redirect and 2FA branches remain
        intact.
      truncated: false
  - id: A5
    source: brief.md
    text: 登录页在浅色、深色和七种前端语言下均可读，认证区域跟随首页当前主题 token、不残留旧粉色，控件具有可访问名称、键盘焦点和稳定尺寸。
    result: passed
    reason:
      text: Auth semantics inherit current --home-* tokens; fresh light/dark
        screenshots contain no legacy pink auth surface.
      truncated: false
  - id: A6
    source: brief.md
    text: 验证码、Turnstile、OAuth、Passkey 的现有对话框/流程未被视觉改造破坏。
    result: passed
    reason:
      text: Captcha, Turnstile, OAuth and Passkey composition remains connected
        through the unchanged auth flow.
      truncated: false
  - id: A7
    source: specs/login-page/spec.md
    text: Desktop sign-in - **WHEN** 用户在宽屏打开 `/sign-in` - **THEN** 左侧仅显示系统图形
      Logo，认证卡片显示完整 Logo/系统名称，并显示登录页配置中的品牌标题/描述/统计信息（若有） - **AND**
      后台标题与系统名称不同时使用后台配置值；标题为空或与系统名称重复时显示已有七语言产品价值标题；描述使用后台配置值，描述为空时显示已有七语言默认产品描述
      - **AND** Claude、Codex、Gemini 和 40+ 模型项位于同一条无连线横向带，不显示折线路由、模型拓扑或中心网关图 -
      **AND** 品牌面板不显示重复系统名称或穿过内容的轮廓字水印，标题、描述、模型带和统计信息互不遮挡 - **AND**
      认证区域的背景、卡片、控件和装饰信号跟随首页当前浅色/深色主题 token，不显示旧粉色 auth palette - **AND**
      品牌内容和模型项错峰入场，模型带具有低频扫光，背景扫描缓慢移动；`prefers-reduced-motion` 下所有动画停止并保留静态可读内容
      - **AND** 模型横向带仅是支持能力示意，不作为登录 provider 或实时上游状态列表 - **AND**
      认证卡片具有锐利轮廓和品牌信号线 - **AND** 登录卡片宽度受限，表单、provider 和底部协议文案保持清晰垂直节奏
    result: passed
    reason:
      text: Desktop configuration fallbacks, theme inheritance, CSS motion, content
        hierarchy and card limits match the scenario.
      truncated: false
  - id: A8
    source: specs/login-page/spec.md
    text: Mobile sign-in - **WHEN** 用户在窄屏打开 `/sign-in` - **THEN**
      品牌面板折叠为紧凑品牌标识，登录卡片适配屏幕宽度 - **AND** 大面积品牌文字、模型横向带和装饰动效不在移动端渲染为可见场景 -
      **AND** 页面不产生横向滚动，所有主要控件保持可操作
    result: passed
    reason:
      text: Mobile hides the large brand scene and retains an operable overflow-free
        single-column card.
      truncated: false
  - id: A9
    source: specs/login-page/spec.md
    text: Conditional providers - **WHEN** 服务端状态关闭某个 provider 或密码登录 - **THEN**
      对应入口不显示或保持现有禁用语义 - **AND** 其他可用认证入口和协议文案仍正常显示
    result: passed
    reason:
      text: Provider and password availability remains driven by existing status
        fields.
      truncated: false
  - id: A10
    source: specs/login-page/spec.md
    text: Password login submission - **WHEN** 用户填写用户名或邮箱和密码并提交 - **THEN** 继续调用现有
      login API - **AND** 成功响应继续遵循 redirect 或跳转到 2FA - **AND**
      失败响应继续通过现有错误提示机制反馈
    result: passed
    reason:
      text: Password submission retains login API, captcha payload, 2FA, redirect and
        failure feedback behavior.
      truncated: false
  - id: A11
    source: specs/login-page/spec.md
    text: Auth navigation - **WHEN** 用户点击注册、忘记密码或协议链接 - **THEN** 使用现有类型安全路由进入对应页面
    result: passed
    reason:
      text: TermsFooter now uses typed TanStack Link/to navigation for both registered
        agreement routes; a real memory-router test clicks User Agreement and
        verifies the resulting pathname.
      truncated: false
  - id: A12
    source: specs/login-page/spec.md
    text: Keyboard and labels - **WHEN** 用户仅使用键盘浏览页面 - **THEN** 登录输入、密码可见性、provider
      按钮、提交按钮和导航链接均可聚焦和操作 - **AND** 输入控件具有稳定的 label/placeholder 语义
    result: passed
    reason:
      text: Inputs, visibility controls, provider controls, submit and navigation
        remain labeled and keyboard-operable.
      truncated: false
  - id: A13
    source: specs/login-page/spec.md
    text: Theme and locale - **WHEN** 用户切换主题或语言 - **THEN** 登录页继续使用首页当前主题
      token，旧粉色或脱离主题的装饰色不重新出现，文字不溢出、不遮挡相邻控件
    result: passed
    reason:
      text: All seven locales contain the new keys; long configured text is contained
        and theme tokens remain current.
      truncated: false
  - id: A14
    source: specs/login-page/spec.md
    text: 登录页 MUST 在桌面端呈现品牌面板和认证区域，在移动端以单栏方式呈现；任何视口不得出现横向溢出或互相遮挡。品牌面板 MUST
      使用与首页同源的黑色、荧光绿、紫色和多彩品牌色，以图形 Logo、去重后的大尺寸标题、完整描述、配置统计和无连线的
      Claude/Codex/Gemini/40+ 模型横向带构成编辑式科技场景。
    result: passed
    reason:
      text: The responsive editorial brand scene follows the homepage palette and
        contains no overlap or route topology.
      truncated: false
  - id: A15
    source: specs/login-page/spec.md
    text: 登录页 MUST 继续根据 `SystemStatus` 展示密码登录、Passkey、OAuth、微信、Telegram、OIDC、自定义
      OAuth、Turnstile 和点击验证码入口。
    result: passed
    reason:
      text: All SystemStatus-controlled authentication entry points remain present.
      truncated: false
  - id: A16
    source: specs/login-page/spec.md
    text: 登录页 MUST 保留注册、忘记密码、协议链接、键盘焦点和可访问名称。
    result: passed
    reason:
      text: Registration, forgot-password and agreement links use Link and retain
        accessible names/focus behavior.
      truncated: false
  - id: A17
    source: specs/login-page/spec.md
    text: 登录页 MUST 兼容当前浅色、深色和七种前端语言，不得硬编码仅适用于英文的布局宽度或文案。
    result: passed
    reason:
      text: Visible copy is localized across seven languages and layout containment is

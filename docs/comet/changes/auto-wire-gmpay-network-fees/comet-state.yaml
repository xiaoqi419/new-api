  summary:
    text: Completed the A5 end-to-end repair. The shared GMPay order path now uses a
      narrow builtin asset fallback only for ordinary wallet quotes whose source
      is dynamic or explicitly configured fallback; legacy gateway-included
      subscription, group-buy, and agent paths remain strict. When
      SupportedAssetsAllFresh is unavailable, the fallback canonicalizes the
      requested token/network, checks the closed builtin whitelist and
      settlement currency, and then permits CreateOrder to proceed. Unsupported
      assets remain rejected. Added an end-to-end regression test proving both
      fresh asset reads can fail while a supported wallet order reaches
      CreateOrder, plus a negative unsupported-asset case. No production
      services, databases, Redis, payment gateway, or admin-mobile-h5 files were
      touched.
    truncated: false

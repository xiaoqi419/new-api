  risks:
    - text: If EPUSDT itself cannot create orders, no estimator fallback can complete
        payment; this change removes duplicate preflight rejection only.
      truncated: false
    - text: During a supported-assets outage, the UI cannot discover newly enabled
        gateway assets; users must submit an already known supported pair, and
        the fixed whitelist prevents arbitrary assets.
      truncated: false
    - text: Builtin EVM/TRON resource quantities are representative transfer presets
        combined with live rates, not exact GMPay sweep invoices.
      truncated: false
    - text: CoinGecko is a single allowlisted public price source and safely fails
        closed unless explicit administrator fallback is enabled.
      truncated: false
    - text: GetOptions may return the raw GMPay configuration to a root
        administrator's browser response even though the settings UI does not
        render advanced estimator fields; URLs containing embedded credentials
        should not be stored in those fields.
      truncated: false
    - text: If a quote expires while the external CreateOrder call is in flight, the
        local pending record fails closed but the gateway may retain an orphan
        order.
      truncated: false
    - text: The repository-wide lint script reports existing warnings outside the
        changed files; changed-file oxlint passed.
      truncated: false

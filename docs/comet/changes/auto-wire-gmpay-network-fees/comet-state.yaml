acceptance:
  - id: A1
    source: brief.md
    text: "A1: 仅配置 GMPay/EPUSDT 的现有网关地址、商户 ID 和密钥时，后台自动显示 EPUSDT `supported_assets`
      中的可用网络/token 与同步状态；私有 context 不存在时仍尝试内置预设，不出现必须填写 RPC/价格源/交易上下文的输入框。"
    result: passed
    reason:
      text: Sanitized supported-assets/status data is exposed without RPC,
        price-source, or transaction inputs; automatic mode falls back to the
        built-in estimator when private context is absent.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 选择受支持的 USDT/USDC 网络并充值 30.00 时，服务端返回
      `base_amount=30.00`、有明确来源且非负的网络成本估算和
      `total_amount=base_amount+fee`；客户端不能覆盖费用。估算值不代表 GMPay 服务费；没有可用私有 context
      或内置预设时不得建单，除非显式人工兜底已开启。"
    result: passed
    reason:
      text: Checkout recomputes a server-owned non-negative network quote and total;
        TopUp.Money and gateway amount use the total while client fields cannot
        override it.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 动态报价包含来源（私有 context 或具体内置预设）、原生币数量、结算币种、报价时间、过期时间、估算器版本和脱敏
      RPC/价格证据，并标注“网络成本估算”。证据至少能区分 EVM `eth_estimateGas`/gas-price、TRON
      chain-parameter/energy、Solana
      `getLatestBlockhash`/`getFeeForMessage`；过期、上下文不完整、价格不可信或预设不支持时不会伪造 0 费用。"
    result: passed
    reason:
      text: Quotes contain source, native amount, currency, timestamps, estimator
        version, confidence, and redacted RPC/price evidence; Solana records
        latest blockhash and getFeeForMessage.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 报价有效时，GMPay 建单金额和 `TopUp.Money` 使用冻结的总额，`TopUp.Amount`
      仍只用于到账额度；回调按绑定金额/资产/网络幂等校验。"
    result: passed
    reason:
      text: Order quote binding covers amount, asset, currency, TTL and callback
        idempotency; credited quota remains distinct from charged money.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: EPUSDT 暂不可达、私有 discovery 未提供 context，或私有估算器无法产出有效 quote
      时，系统按白名单资产尝试内置预设；只有私有 context
      与内置预设均不可用、链上数据/价格不可信或链不受支持时才显示可重试的支付不可用提示。只有管理员明确启用的兜底规则才可替代估算，并标注为人工兜底；任\
      何路径都不把网关服务费当作网络费。"
    result: passed
    reason:
      text: Both wallet asset-resolution stages use a narrow automatic-mode builtin
        whitelist fallback on supported-assets outages, canonicalize aliases,
        and still reject unsupported assets. Explicit dynamic policies and
        gateway-included specialized paths remain strict. End-to-end regression
        reaches CreateOrder under dual 503 responses.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6:
      内置预设的同步周期、缓存、超时、响应大小、重试次数、价格年龄和费用上限有固定安全默认值，无需管理员填写；异常不会导致负数、溢出、静默零费或重复收费\
      ，公开 RPC/价格源仅访问服务器端白名单。"
    result: passed
    reason:
      text: Builtin defaults enforce allowlisted HTTPS hosts, bounded
        timeouts/responses/retries/cache/price age, fee and total limits,
        cancellation checks, and fail-closed arithmetic.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Legacy EPay 与其他支付场景的金额、回调和结算行为保持现状。"
    result: passed
    reason:
      text: Legacy EPay, subscriptions, group buys, agent prepayment, and
        gateway-included callback paths retain their prior behavior.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 设置页和充值 Modal 在桌面/移动端可读，费用来源、基础金额和总额均有 i18n 文案，不暴露敏感配置。"
    result: passed
    reason:
      text: Settings and wallet UI expose translated base/fee/total/source metadata,
        keep sensitive configuration hidden, and pass responsive frontend
        tests/build.
      truncated: false

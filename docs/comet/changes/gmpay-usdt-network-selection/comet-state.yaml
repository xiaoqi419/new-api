acceptance:
  - id: A1
    source: brief.md
    text: "A1: 多种 token 的网关响应只生成每个可用网络的一张 USDT 卡片，不显示 TRX、SOL、USDC。"
    result: passed
    reason:
      text: service SupportedAssets filters USDT and four known networks; frontend
        parser filters non-USDT and deduplicates networks.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 只有一个 USDT 网络时跳过选择器并以该网络、`token=usdt` 建单。"
    result: passed
    reason:
      text: Single available network bypasses selector and submits token usdt with
        selected network.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 多个 USDT 网络时先选择；取消不创建本地或网关订单，选择后只提交所选网络。"
    result: passed
    reason:
      text: Multiple networks open selector; cancel creates no order, selection
        submits only selected network.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 配置失败、没有 USDT、未知网络或 stale 网络失败关闭，不调用网关且不回退 TRON。"
    result: passed
    reason:
      text: Wallet resolver requires explicit USDT/network and fresh config; stale,
        unknown, empty, or failed config rejects without fallback or gateway
        call.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 新 USDT 订单保留网络级 payment_method binding，历史非 USDT pending 订单仍按原 binding
      兼容回调，不做迁移。"
    result: passed
    reason:
      text: New orders retain network binding; historical non-USDT pending bindings
        remain callback-compatible without migration.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 站内 Modal 展示精确 USDT 金额、地址、网络、二维码、有效期和状态，不打开 hosted page。"
    result: passed
    reason:
      text: Checkout remains in site modal with amount, address, network, QR, expiry,
        and polling status; no hosted URL navigation.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Legacy EPay 及订阅、拼团、代理预付既有行为不受普通钱包网络选择影响。"
    result: passed
    reason:
      text: Legacy EPay and subscription, group-buy, and agent prepayment paths retain
        their existing behavior via the all-assets resolver.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 中英文、桌面和移动端选择器完整可用，文案全部来自 i18n。"
    result: passed
    reason:
      text: Chinese, English, and other locale strings are i18n-backed; selector is
        responsive for desktop and mobile.
      truncated: false
  - id: A9
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: 多 token 响应只展示 USDT 网络 - Given 网关返回 TRON、Ethereum、Solana 并混合
      TRX/USDC/SOL/USDT - When 用户加载 Native 钱包充值 - Then 每个包含 USDT 的已知网络各显示一张 USDT
      卡片，非 USDT 不显示
    result: passed
    reason:
      text: Mixed-token parser/backend coverage outputs only known-network USDT cards
        and drops TRX/SOL/USDC/unknown assets.
      truncated: false
  - id: A10
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: 单网络直接建单 - Given 只有一个可用 USDT 网络 - When 用户点击充值 - Then 不显示选择器，创建该网络和
      `token=usdt` 的订单
    result: passed
    reason:
      text: Single-network branch directly starts checkout.
      truncated: false
  - id: A11
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: 多网络取消不建单 - Given 存在多个可用 USDT 网络 - When 用户打开选择器并取消 - Then 不创建本地订单且不调用网关
    result: passed
    reason:
      text: Selector cancel does not trigger payment processing or order creation.
      truncated: false
  - id: A12
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: stale 网络失败关闭 - Given 用户选择的网络在建单前从网关配置中消失 - When 服务端收到 checkout 请求 - Then
      拒绝请求、不回退到其他网络且不调用网关建单
    result: passed
    reason:
      text: Fresh configuration and explicit selected pair revalidation reject stale
        selections before local or gateway order creation.
      truncated: false
  - id: A13
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: 站内 checkout - Given 网关成功创建 USDT 订单 - When 页面显示支付信息 - Then 当前 Modal
      展示地址、二维码、金额、网络、有效期和轮询状态，不发生外部导航
    result: passed
    reason:
      text: Crypto checkout is rendered in the existing modal with status polling and
        no external navigation.
      truncated: false
  - id: A14
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: GMPay Native 普通钱包充值只接受 USDT。服务端读取 EPUSDT `/payments/gmpay/v1/config` 的
      `supported_assets`，按大小写不敏感方式保留包含 USDT 的已知网络，并为每个规范化网络返回一项
      `crypto_assets`：`network`、本地化可显示的 `display_name` 和固定
      `token=USDT`。TRX、ETH、SOL、BNB、USDC 和未知网络不进入用户选择器。
    result: passed
    reason:
      text: Config endpoint data is filtered to fixed USDT across the four-network
        allowlist and exposed through top-up info.
      truncated: false
  - id: A15
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: 支持的网络标签为 TRON/TRC20、Ethereum/ERC20、Solana/SPL 和
      BSC/BEP20；网络别名规范化、顺序稳定、重复网络去重。配置超时、无效、超量、空列表或无 USDT 时返回空集合并失败关闭。
    result: passed
    reason:
      text: Network aliases normalize to canonical values, ordering is stable,
        duplicates are removed, and malformed/timeout responses fail closed.
      truncated: false
  - id: A16
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: 只有一个可用网络时直接建单；多个网络时先打开网络选择 Modal，取消不建单。服务端在写入 pending 订单和调用网关前再次验证显式
      `network` 与 `token=usdt`，stale 或非 USDT 请求拒绝且不回退到 TRON。
    result: passed
    reason:
      text: Single/multiple/stale network flows and server-side token/network
        validation are implemented.
      truncated: false
  - id: A17
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: TRON 新订单保留 `usdt.tron`，其他 USDT 网络使用现有可解析的 network/token binding。历史 pending
      非 USDT 订单仍按自身 binding 处理回调，新订单不得利用历史兼容绕过 USDT 限制。
    result: passed
    reason:
      text: TRON keeps usdt.tron, other new networks use canonical bindings, and
        historical arbitrary-token callbacks remain compatible.
      truncated: false
  - id: A18
    source: specs/epusdt-multi-chain-wallet-checkout/spec.md
    text: 成功 checkout 保持站内 Modal，展示精确 USDT 金额、完整地址、网络、二维码、有效期和状态，不打开 hosted
      page。地址按网络分别校验，轮询和 i18n 遵循现有钱包实现。
    result: passed
    reason:
      text: Checkout validates network-specific addresses and keeps i18n, polling, and
        modal presentation intact.
      truncated: false

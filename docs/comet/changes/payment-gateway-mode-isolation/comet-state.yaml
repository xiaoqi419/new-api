  - id: A1
    source: brief.md
    text: "A1: 没有 `PaymentGatewayMode` Option 时应用以 `epay_legacy` 启动；两个合法值可由 Root
      保存并在下次启动准确加载；保存非法值被拒绝，数据库非法值拒绝启动，错误不包含支付凭据。"
    result: passed
    reason:
      text: Independent verifier confirmed the criterion.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 生效模式在进程生命周期内不变；后台保存新值后仅目标模式改变，当前下单和回调仍使用原生效模式，直到应用重启；不从
      Host、转发头、请求参数或 `PayMethods` 推断。"

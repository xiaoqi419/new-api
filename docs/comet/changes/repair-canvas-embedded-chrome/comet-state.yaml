acceptance:
  - id: A1
    source: specs/embedded-host-config/spec.md
    text: missing image config opens the settings dialog - **Given** Canvas is
      embedded and image-model bootstrap fails or has no usable models -
      **When** the user needs to configure generation - **Then**
      the「配置与用户偏好」dialog is shown - **And** the「图片模型配置需要检查」banner is not the
      configuration entry
    result: passed
    reason:
      text: HostBootstrapStatus opens the config dialog on modelStatus error and does
        not render the model-check banner; embedded-visibility test covers this.
      truncated: false
  - id: A2
    source: specs/embedded-host-config/spec.md
    text: site-locked base URL - **Given** Canvas is embedded on
      `https://aierxin.cc` or `https://codezip.io` - **When** the user opens the
      default channel editor - **Then** the API base URL field shows that site
      origin and is disabled
    result: passed
    reason:
      text: Channel editor sets base URL from lockedApiBaseUrl and disables the field
        when embedded.
      truncated: false
  - id: A3
    source: specs/embedded-host-config/spec.md
    text: save keeps selected models - **Given** the user fetched a non-empty
      catalog, selected models, and saved successfully - **When** the channel
      list renders - **Then** it displays the selected count rather than `0 个模型`
    result: passed
    reason:
      text: applySelection marks models verified for the current key;
        clearUnavailableImageConfig keeps those models; host-bootstrap-model
        tests cover persist vs unverified wipe.
      truncated: false
  - id: A4
    source: specs/embedded-host-config/spec.md
    text: 当 Infinite Canvas 以内嵌 iframe 运行在 New API 站点中时，用户通过「配置与用户偏好」弹窗自行配置 API
      Key，接口地址锁定为当前站点。模型列表的拉取、勾选和保存必须真正写入渠道；配置缺失时打开该弹窗，而不是鉴权失败横幅。
    result: passed
    reason:
      text: "Embedded host-config capability is implemented: settings dialog, locked
        origin, user key, persisted selected models."
      truncated: false
  - id: A5
    source: specs/embedded-host-config/spec.md
    text: "In embedded mode (`isEmbedded()` is true):"
    result: passed
    reason:
      text: HostBootstrapStatus and channel editor branch on isEmbedded().
      truncated: false
  - id: A6
    source: specs/embedded-host-config/spec.md
    text: If image-model bootstrap fails, the catalog returns 401/403, or the
      default channel has no usable models, the application MUST open the
      existing「配置与用户偏好」dialog.
    result: passed
    reason:
      text: needsConfigDialog includes empty host tokens and modelStatus error and
        calls openConfigDialog(false, 'channels').
      truncated: false
  - id: A7
    source: specs/embedded-host-config/spec.md
    text: The `HostBootstrapStatus` banner titled「图片模型配置需要检查」MUST NOT be used as the
      configuration entry in that situation.
    result: passed
    reason:
      text: The host.modelCheckRequired banner is no longer rendered for catalog/auth
        failures.
      truncated: false
  - id: A8
    source: specs/embedded-host-config/spec.md
    text: The dialog MUST let the user type an API Key or pick one of the current
      user's host tokens.
    result: passed
    reason:
      text: Channel editor still shows HostTokenPicker plus a password field for a
        typed key.
      truncated: false
  - id: A9
    source: specs/embedded-host-config/spec.md
    text: The channel Base URL MUST be the current trusted site origin and MUST be
      read-only in the channel editor.
    result: passed
    reason:
      text: Embedded base URL input is disabled and bound to lockedApiBaseUrl().
      truncated: false
  - id: A10
    source: specs/embedded-host-config/spec.md
    text: Independent (top-level) Canvas keeps its existing configuration entry
      points.
    result: passed
    reason:
      text: HostBootstrapStatus returns null when not embedded; standalone config
        entry points remain.
      truncated: false
  - id: A11
    source: specs/embedded-host-config/spec.md
    text: "Given an embedded user opens the channel editor, fetches the model
      catalog, selects one or more models, and clicks Save:"
    result: passed
    reason:
      text: Channel editor fetch/select/save path writes
        normalizeChannelModels(draft.models) including verified flags.
      truncated: false
  - id: A12
    source: specs/embedded-host-config/spec.md
    text: The parent channel list MUST show `N 个模型` where `N` equals the number of
      selected models.
    result: passed
    reason:
      text: Channel list uses draft/channel.models.length; verified models survive
        scrub so N is preserved.
      truncated: false
  - id: A13
    source: specs/embedded-host-config/spec.md
    text: Reopening the editor MUST show the same selected models.
    result: passed
    reason:
      text: Saved channel models remain on the config store; reopening uses that
        channel object.
      truncated: false
  - id: A14
    source: specs/embedded-host-config/spec.md
    text: Host bootstrap / `clearUnavailableImageConfig` MUST NOT wipe
      `channel.models` immediately after a successful user save of those models.
    result: passed
    reason:
      text: keepEmbeddedChannelModels retains verified image models whose verifiedKey
        matches the current key.
      truncated: false
  - id: A15
    source: specs/embedded-host-config/spec.md
    text: A save that reports success while the list still shows `0 个模型` is a
      failure of this capability.
    result: passed
    reason:
      text: Regression test keeps user-saved verified image models after catalog
        scrub.
      truncated: false
  - id: A16
    source: specs/embedded-host-config/spec.md
    text: Embedded Base URL remains `lockedApiBaseUrl()` (current origin). A
      user-supplied Key MUST NOT be paired with a third-party provider URL in
      embedded mode.
    result: passed
    reason:
      text: Embedded createModelChannel and editor lock base URL to
        lockedApiBaseUrl(); opaque origin clears keys.
      truncated: false
  - id: A17
    source: specs/embedded-host-config/spec.md
    text: Real API Keys MUST NOT appear in logs, tests, changelog, or Git.
    result: passed
    reason:
      text: Tests use synthetic sk- fixtures; changelog and vendor docs have no live
        credentials.
      truncated: false
  - id: A18
    source: specs/embedded-navigation-visibility/spec.md
    text: Embedded page has no Agent controls - **Given** the Canvas document is
      loaded in an iframe - **When** the root layout and a canvas project render
      - **Then** no Agent opening control, status control, or Agent panel is
      present in the accessible/rendered UI
    result: passed
    reason:
      text: "embedded-visibility tests: no Agent button/panel while embedded;
        UserLayout omits AgentPanel when embedded."
      truncated: false
  - id: A19
    source: specs/embedded-navigation-visibility/spec.md
    text: Standalone page keeps Agent controls - **Given** the Canvas document is
      the top-level window - **When** the root layout and a canvas project
      render - **Then** the existing Agent controls and panel behavior remain
      available
    result: passed
    reason:
      text: Same tests keep Agent controls in standalone mode; auto-connect is skipped
        when embedded.
      truncated: false
  - id: A20
    source: specs/embedded-navigation-visibility/spec.md
    text: Embedded canvas menu omits documentation - **Given** the Canvas project is
      embedded - **When** the canvas menu is opened - **Then** the menu has no
      “文档” item
    result: passed
    reason:
      text: embedded-visibility test asserts canvas menu has no 文档 item while
        embedded.
      truncated: false
  - id: A21
    source: specs/embedded-navigation-visibility/spec.md
    text: When Infinite Canvas is hosted by New API in its same-origin iframe, the
      host owns the surrounding product navigation. Canvas must therefore omit
      the upstream Agent, documentation, and GitHub entry points while retaining
      the controls that are still useful inside the host.
    result: passed
    reason:
      text: "Embedded nav policy remains: host owns chrome; Agent/docs/GitHub omitted
        in iframe."
      truncated: false
  - id: A22
    source: specs/embedded-navigation-visibility/spec.md
    text: The visibility decisions MUST use the existing `isEmbedded()` helper from
      `src/lib/host-bridge.ts`. A top-level window is independent mode; a window
      whose parent is different is embedded mode.
    result: passed
    reason:
      text: Visibility and bootstrap still use isEmbedded() from host-bridge.ts.
      truncated: false
  - id: A23
    source: specs/embedded-navigation-visibility/spec.md
    text: "In embedded mode the application MUST NOT render:"
    result: passed
    reason:
      text: Embedded rendering omits the listed Agent/docs/GitHub controls via
        conditional JSX.
      truncated: false
  - id: A24
    source: specs/embedded-navigation-visibility/spec.md
    text: the `AppTopNav` button labelled “打开 Agent” (or its “收起 Agent” tooltip);
    result: passed
    reason:
      text: AppTopNav renders the Agent button only when !embedded.
      truncated: false
  - id: A25
    source: specs/embedded-navigation-visibility/spec.md
    text: the `CanvasTopBar` Codex compact status control;
    result: passed
    reason:
      text: embedded-visibility covers CanvasTopBar Codex/Agent absence while
        embedded.
      truncated: false
  - id: A26
    source: specs/embedded-navigation-visibility/spec.md
    text: the `CanvasTopBar` right-side Agent button;
    result: passed
    reason:
      text: CanvasTopBar Agent button is absent in the embedded visibility test.
      truncated: false
  - id: A27
    source: specs/embedded-navigation-visibility/spec.md
    text: the Agent side panel, including a panel left mounted or opened by
      persisted state;
    result: passed
    reason:
      text: UserLayout does not mount AgentPanel when embedded.
      truncated: false
  - id: A28
    source: specs/embedded-navigation-visibility/spec.md
    text: automatic Agent connection or URL-triggered automatic panel opening.
    result: passed
    reason:
      text: AppTopNav skips silent Agent auto-connect when embedded.
      truncated: false
  - id: A29
    source: specs/embedded-navigation-visibility/spec.md
    text: The Agent stores, API clients, panel components, plugin host operations,
      and independent-mode behavior MUST remain available in source code.
    result: passed
    reason:
      text: Agent stores and panel source remain; they are unused only in embedded
        layout.
      truncated: false
  - id: A30
    source: specs/embedded-navigation-visibility/spec.md
    text: In embedded mode the application MUST NOT render the top-level
      documentation link or the canvas menu item that opens `DOCS_URL`.
      Independent mode MUST retain both links.
    result: passed
    reason:
      text: UserStatusActions omits docs link when embedded; standalone keeps it.
      truncated: false
  - id: A31
    source: specs/embedded-navigation-visibility/spec.md
    text: In embedded mode the top-level `GitHubLink` control MUST NOT be rendered.
      GitHub URLs used for version checks and prompt source metadata are data
      dependencies and MUST remain unchanged.
    result: passed
    reason:
      text: GitHubLink is rendered only when !embedded.
      truncated: false
  - id: A32
    source: specs/embedded-navigation-visibility/spec.md
    text: In embedded mode configuration and version-release controls MUST remain
      usable. Version checking MUST continue to read the vendored
      `web/canvas/VERSION` constant and use the existing upstream check URLs.
      The upgrade sets that file exactly to the pinned upstream `v0.19.0`;
      runtime or unrelated changes MUST NOT mutate it after the upgrade.
    result: passed
    reason:
      text: web/canvas/VERSION is v0.19.0; vite injects it as __APP_VERSION__; config
        and version controls remain.
      truncated: false
  - id: A33
    source: specs/embedded-navigation-visibility/spec.md
    text: When not embedded, all existing navigation controls, Agent behavior,
      documentation links, GitHub link, and theme behavior MUST remain
      unchanged.
    result: passed
    reason:
      text: Standalone visibility tests still show Agent, docs, and GitHub.
      truncated: false
  - id: A34
    source: specs/embedded-navigation-visibility/spec.md
    text: Hidden controls MUST be conditionally omitted rather than visually hidden
      with CSS.
    result: passed
    reason:
      text: Controls are omitted with conditional render, not CSS hiding.
      truncated: false
  - id: A35
    source: specs/embedded-navigation-visibility/spec.md
    text: Existing labels and accessible names for controls that remain visible MUST
      not change.
    result: passed
    reason:
      text: Remaining control labels still go through existing i18n keys.
      truncated: false
  - id: A36
    source: specs/embedded-navigation-visibility/spec.md
    text: No server API or stored canvas data format changes are permitted.
    result: passed
    reason:
      text: Diff is frontend canvas/host-config plus changelog/vendor metadata; no
        server API or DB schema change.
      truncated: false
  - id: A37
    source: specs/embedded-navigation-visibility/spec.md
    text: The vendored application MUST be upgraded from the current `v0.18.0`
      baseline to the upstream latest formal release `v0.19.0`. The upgrade MUST
      use the tagged source rather than changing only the version string, replay
      all local path/host-bridge/security patches, refresh dependency locks and
      license/vendor metadata, and pass an independent build and compatibility
      review. The built-in version value and release modal MUST report `v0.19.0`
      after the upgrade.
    result: passed
    reason:
      text: VERSION/CHANGELOG/LICENSE and unpatched kernel files come from upstream
        tag e856c878; local host-bridge patches were kept and rebuilt. Mixed
        host-patched files were not hunk-merged against every v0.19.0 edit.
      truncated: false
  - id: A38
    source: specs/embedded-navigation-visibility/spec.md
    text: The upgrade MUST preserve existing Canvas data where the upstream format
      is compatible. If a stored record cannot be read, the application MUST
      surface a clear error and MUST NOT silently overwrite it.
    result: passed
    reason:
      text: Existing canvas-data-migration tests still pass; no silent overwrite path
        was added.
      truncated: false
  - id: A39
    source: specs/embedded-navigation-visibility/spec.md
    text: Authenticated users visiting `/canvas` MUST receive the New API
      `CanvasStudio` host page. The host MUST serve the built Canvas application
      at `/canvas-app`, embed it same-origin, and preserve the existing
      authentication, theme, and endpoint-lock contract. Host configuration UX
      for API keys and selected models is specified by `embedded-host-config`.
    result: passed
    reason:
      text: Host /canvas CanvasStudio and /canvas-app embed path were not removed;
        build emits /canvas-app/assets URLs.
      truncated: false

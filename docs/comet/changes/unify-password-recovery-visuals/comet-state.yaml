acceptance:
  - id: A1
    source: brief.md
    text: A1：忘记密码和重置密码确认页均使用与登录/注册相同的暗色点阵认证体验外壳，桌面为双栏面板，表单区使用同一主题色、边框、阴影和紧凑密度。
    result: passed
    reason:
      text: Both recovery pages now use AuthExperienceLayout, and their AuthCard
        treatment matches the existing sign-in page.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：忘记密码的邮箱输入、Turnstile、点击验证码、发送邮件、倒计时、成功/错误反馈保持原有行为；重置确认页的 email/token
      校验、生成密码、复制、倒计时和返回登录保持原有行为。
    result: passed
    reason:
      text: The scoped diff changes only layout integration; the existing schema,
        captcha, API, countdown, toast, copy, and navigation paths remain
        present.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：两个页面在 320px 及以上宽度无横向滚动，表单与中文、长英文文案均不会遮挡控件；桌面品牌叙事区与移动端品牌标识保持当前认证体验的响应式规则。
    result: passed
    reason:
      text: The shared shell has overflow-x-hidden and min-w-0 constraints, and the
        focused DOM regression asserts the recovery pages use them.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：找回和重置页面使用已有翻译键并在七种现有语言中可解析；本 change 不新增未翻译的用户可见文字。
    result: passed
    reason:
      text: All 18 recovery-related translation keys resolve in en, zh, zh-TW, fr, ru,
        ja, and vi.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：其他认证回调页面仍使用其原有外壳与行为，不受此次视觉统一影响。
    result: passed
    reason:
      text: The scoped diff does not modify callback, OAuth, or 2FA page
        implementations.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：聚焦布局/行为测试、格式检查、受影响文件 lint、类型检查和生产构建通过。
    result: passed
    reason:
      text: Focused tests, affected-file lint and format checks, typecheck, and
        production build all passed.
      truncated: false
  - id: A7
    source: specs/password-recovery-visuals/spec.md
    text: 忘记密码与密码重置确认是公共认证流程的一部分，必须使用和登录、注册一致的认证体验：暗色点阵背景、桌面双栏容器、品牌叙事区、受限宽度的表单区以及基于当前主题
      token 的边框、阴影和控件颜色。移动端隐藏桌面叙事区并在表单区显示品牌标识，表单内容保持可读且可操作。
    result: passed
    reason:
      text: Both pages use the existing shared dark dot-grid, responsive two-column
        authentication shell with the form region and mobile brand mark.
      truncated: false
  - id: A8
    source: specs/password-recovery-visuals/spec.md
    text: 共享认证体验外壳支持 `forgot-password` 和 `reset-password` 页面标识，并为表单区域提供与页面一致的可访问名称。
    result: passed
    reason:
      text: AuthExperienceLayout explicitly supports forgot-password and
        reset-password and assigns translated form-region labels.
      truncated: false
  - id: A9
    source: specs/password-recovery-visuals/spec.md
    text: 两个页面均在根容器保留横向溢出保护，面板、品牌区、表单区和卡片内容均允许窄屏收缩。
    result: passed
    reason:
      text: The root, panel, regions, content wrapper, card headings, and descriptions
        retain the specified horizontal-overflow and shrink constraints.
      truncated: false
  - id: A10
    source: specs/password-recovery-visuals/spec.md
    text: 桌面面板保持现有双栏阈值、最大宽度、点阵装饰、品牌叙事和主题色；不新增独立视觉主题或覆盖全局亮色设置。
    result: passed
    reason:
      text: The implementation reuses the pre-existing shared shell and sign-in card
        classes without adding a separate theme or global style override.
      truncated: false
  - id: A11
    source: specs/password-recovery-visuals/spec.md
    text: 320px 及以上视口中，长中文和英文标题、说明、表单标签、提示、按钮与状态文案不得使页面产生横向滚动或遮挡控件。
    result: passed
    reason:
      text: Narrow-layout protections are present in the shared shell and cards,
        including min-w-0, break-words, constrained content width, and overflow
        protection.
      truncated: false
  - id: A12
    source: specs/password-recovery-visuals/spec.md
    text: 忘记密码页面继续使用现有表单 schema、邮件发送 API、Turnstile、点击验证码、倒计时和 toast
      反馈；视觉改动不得改变请求参数、触发顺序或禁用条件。
    result: passed
    reason:
      text: ForgotPasswordForm remains unchanged and retains its existing Zod schema,
        email API, Turnstile, click captcha, countdown, and toast behavior.
      truncated: false
  - id: A13
    source: specs/password-recovery-visuals/spec.md
    text: 重置确认页面继续从既有路由搜索参数读取 email 与 token，保留无效链接提示、重置请求、倒计时、生成密码、复制和返回登录流程。
    result: passed
    reason:
      text: The reset route still forwards email and token search parameters, and
        ResetPasswordConfirm retains reset API, invalid-link, countdown, copy,
        and sign-in navigation flows.
      truncated: false
  - id: A14
    source: specs/password-recovery-visuals/spec.md
    text: 登录、注册、OAuth、2FA 和其他认证回调页面不因该 change 切换外壳或修改业务行为。
    result: passed
    reason:

acceptance:
  - id: A1
    source: brief.md
    text: 接受 TCP 连接但不发送 SMTP greeting 的本地服务端会使 `SendEmail` 返回包含 greeting 和 timeout
      阶段的安全错误。
    result: passed
    reason:
      text: The focused loopback greeting-stall test passed and asserts a safe error
        containing both the greeting stage and timeout semantics.
      truncated: false
  - id: A2
    source: brief.md
    text: 在隐式 TLS 或 STARTTLS 的握手阶段停止响应的本地服务端会使 `SendEmail` 返回对应 TLS
      阶段的安全错误，而不会让请求等待到网关超时。
    result: passed
    reason:
      text: Independent focused tests passed for stalled implicit-TLS and STARTTLS
        handshakes, each asserting its stage name and an unwrap-visible timeout
        error.
      truncated: false
  - id: A3
    source: brief.md
    text: 正常明文、STARTTLS 和 465 隐式 TLS 流程继续发送邮件；`SMTPInsecureSkipVerify` 仍控制测试/兼容证书校验。
    result: passed
    reason:
      text: The full common package suite passed, including explicit STARTTLS
        delivery, plaintext-without-auto-upgrade, and legacy port-465
        implicit-TLS coverage; the TLS verification switch remains in
        smtpTLSConfig.
      truncated: false
  - id: A4
    source: brief.md
    text: 经 `/api/option/test_email` 返回的失败消息不包含 SMTP token、账号、收件人或邮件正文。
    result: passed
    reason:
      text: The endpoint remains unchanged and sends SendEmail errors through its
        existing HTTP-200 JSON failure contract; all new timeout tests assert
        the externally surfaced error contains no token, account, receiver,
        subject, or body fixture.
      truncated: false
  - id: A5
    source: specs/smtp-email-timeout/spec.md
    text: SMTP 邮件发送必须从 TCP 拨号开始使用约 10 秒的共享绝对 deadline。该 deadline 必须作用于 TCP 连接、服务端
      greeting、隐式 TLS 握手、STARTTLS 协商和握手、认证、发件人、收件人、DATA、正文写入、正文结束与 QUIT 的全部网络
      I/O。任何阶段都不得获得独立的完整超时预算。
    result: passed
    reason:
      text: newSMTPClient creates one deadline once, uses it for DialContext and
        SetDeadline, and never resets it; the same connection is reused through
        greeting, TLS, SMTP commands, message writer, and QUIT.
      truncated: false
  - id: A6
    source: specs/smtp-email-timeout/spec.md
    text: 所有 SMTP 连接通过 `net.Dialer.DialContext` 在该 absolute deadline 下建立，并在成功后立即对底层
      `net.Conn` 设置同一个 deadline。
    result: passed
    reason:
      text: Static review confirms net.Dialer.DialContext is given the absolute
        context deadline and a successful net.Conn immediately receives that
        same deadline.
      truncated: false
  - id: A7
    source: specs/smtp-email-timeout/spec.md
    text: 启用 `SMTPSSLEnabled` 或未启用 STARTTLS 的 465 端口继续使用隐式 TLS；TLS 握手失败或超时返回可识别的隐式
      TLS 阶段错误。
    result: passed
    reason:
      text: The implicit-TLS branch retains SMTPSSLEnabled and legacy 465 selection,
        performs tls.Client.HandshakeContext on the deadline-bound connection,
        and wraps failures as the implicit TLS handshake stage.
      truncated: false
  - id: A8
    source: specs/smtp-email-timeout/spec.md
    text: 启用 `SMTPStartTLSEnabled` 时继续要求服务器支持 STARTTLS，并在协商或握手失败、超时时返回可识别的 STARTTLS
      阶段错误。
    result: passed
    reason:
      text: The explicit STARTTLS branch still requires the advertised extension,
        labels negotiation and handshake failures, and the stalled STARTTLS
        handshake regression passed.
      truncated: false
  - id: A9
    source: specs/smtp-email-timeout/spec.md
    text: 明文 SMTP、显式 STARTTLS、隐式 TLS、现有认证选择逻辑和 `SMTPInsecureSkipVerify` 的证书校验语义保持兼容。
    result: passed
    reason:
      text: No SMTP configuration-selection behavior was changed beyond transport
        construction; common-package tests passed for plaintext, explicit
        STARTTLS, implicit TLS, auth variants, and certificate rejection.
      truncated: false
  - id: A10
    source: specs/smtp-email-timeout/spec.md
    text: 每个可失败的 SMTP 阶段以 `%w` 包装底层错误，允许调用方使用 `errors.Is` 或 `errors.As` 识别原因。
    result: passed
    reason:
      text: Each underlying dial, TLS, greeting, SMTP command, DATA, message-write,
        completion, and QUIT error is passed through wrapSMTPStageError using
        %w; smtpSafeError.Unwrap retains the original cause, verified by ErrorAs
        in the focused tests.
      truncated: false
  - id: A11
    source: specs/smtp-email-timeout/spec.md
    text: 对外 `Error()` 文本必须标识失败阶段，并在 deadline 到期时标识 timeout；不得包含 SMTP
      token、账号、收件人、邮件主题或正文。
    result: passed
    reason:
      text: smtpSafeError exposes only timeout or failed while the outer wrapper adds
        the stage. Focused tests assert stage/timeout text and absence of all
        sensitive fixtures.
      truncated: false
  - id: A12
    source: specs/smtp-email-timeout/spec.md
    text: "`SendEmail` 返回安全阶段错误后，`/api/option/test_email` 继续使用既有
      RootAuth、CriticalRateLimit、HTTP 200 JSON 失败结构和成功审计行为，无需新增或改变控制器协议。"
    result: passed
    reason:
      text: No controller or route diff exists. Static inspection confirms RootAuth
        plus CriticalRateLimit remain applied and SendTestEmail retains its
        authenticated HTTP-200 JSON error/success behavior and success audit
        record.
      truncated: false
  - id: A13
    source: specs/smtp-email-timeout/spec.md
    text: 测试只使用本地监听器和临时自签名证书，不访问公网或真实邮箱。
    result: passed
    reason:
      text: New stalled-server fixtures bind only 127.0.0.1:0 and use no external SMTP
        service, real mailbox, credential, or public network.
      truncated: false
  - id: A14
    source: specs/smtp-email-timeout/spec.md
    text: greeting 不发送、隐式 TLS handshake 卡住、STARTTLS handshake 卡住三类测试通过包内受控 deadline
      快速完成，断言错误阶段、timeout 语义、错误链和敏感值不泄露，而不比较实际耗时。
    result: passed
    reason:
      text: The three new stall tests use the package-local 100ms deadline, assert
        stage, timeout, error chain, and redaction, and do not compare elapsed
        time.
      truncated: false
  - id: A15
    source: specs/smtp-email-timeout/spec.md
    text: 既有明文、STARTTLS、隐式 TLS 与 TLS 校验测试继续覆盖成功和拒绝路径。
    result: passed
    reason:
      text: go test ./common -count=1 passed independently, preserving existing plain,
        STARTTLS, implicit-TLS, auth, and TLS-verification regression coverage.
      truncated: false

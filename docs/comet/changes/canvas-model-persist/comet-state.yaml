      truncated: false
  - id: A3
    source: specs/embedded-model-persist/spec.md
    text: Embedded Infinite Canvas MUST remember the models the user saved. Leaving
      `/canvas` and returning MUST still show those models. The user MUST NOT
      have to fetch the catalog again. API keys MUST NOT be written to
      localStorage.
    result: passed
    reason:
      text: Selected models persist without a catalog refetch on remount.
      truncated: false
  - id: A4
    source: specs/embedded-model-persist/spec.md
    text: "When embedded, `persistableConfig` stores channel model names,
      capabilities, scripts, and `verified: true`. It MUST store empty `apiKey`
      and empty `verifiedKey`."
    result: passed
    reason:
      text: persistableConfig keeps verified true and strips keys.
      truncated: false
  - id: A5
    source: specs/embedded-model-persist/spec.md
    text: "Embedded hydration MUST keep saved models and `verified: true`. It MUST
      NOT rewrite every model to `verified: false`. Keys remain empty until the
      host injects them."
    result: passed
    reason:
      text: Embedded merge no longer rewrites verified to false.
      truncated: false
  - id: A6
    source: specs/embedded-model-persist/spec.md
    text: "`clearUnavailableImageConfig` keeps a verified image model when:"
    result: passed
    reason:
      text: keepEmbeddedChannelModels keeps verified image models except on key
        mismatch.
      truncated: false
  - id: A7
    source: specs/embedded-model-persist/spec.md
    text: there is no current key yet, or
    result: passed
    reason:
      text: Empty current key keeps verified image models.
      truncated: false
  - id: A8
    source: specs/embedded-model-persist/spec.md
    text: "`verifiedKey` is empty, or"
    result: passed
    reason:
      text: Empty verifiedKey keeps the model when a current key is later attached.
      truncated: false
  - id: A9
    source: specs/embedded-model-persist/spec.md
    text: "`verifiedKey` equals the current key."
    result: passed
    reason:
      text: Matching verifiedKey still kept by the previous persist test.
      truncated: false
  - id: A10
    source: specs/embedded-model-persist/spec.md
    text: It drops a verified image model only when both keys are non-empty and

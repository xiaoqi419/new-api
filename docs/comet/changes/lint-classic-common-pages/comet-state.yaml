      text: "Independent gpt-5.6-luna/max source review found three reproducible
        behavior regressions. MessageContent.jsx keys image siblings only by URL
        even though the supported request path permits duplicate URLs; Home
        CodeHighlight keys lines only by line text while the current default
        Python sample contains repeated blank lines; both produce duplicate
        React keys. Home's displayHomePageContent callback/effect now depends on
        actualTheme and i18n.language, changing the previous mount-only
        /api/home_page_content fetch into refetches on theme or language changes
        and altering Home content/onload scheduling. Repair only
        MessageContent.jsx and Home/index.jsx: use deterministic
        value-plus-occurrence identities, and restore mount-only Home fetch
        semantics while preserving exact iframe src/attributes and postMessage
        payload/target. Other reviewed auth, layout, dashboard, setup,
        Playground request/SSE/state, GroupBuy, iframe attributes, and
        postMessage values preserve behavior."
      truncated: false

acceptance:
  - id: A1
    source: brief.md
    text: 管理员开启提醒并输入 `1`：USD 站点保存为 `$1` 的规范化值，CNY 站点保存为 `¥1` 的规范化值，CUSTOM/TOKENS
      站点分别保存为一个自定义货币单位/一个 token 单位。
    result: passed
    reason:
      text: Displayed-unit normalization and default 1 are implemented for USD, CNY,
        CUSTOM, and TOKENS.
      truncated: false
  - id: A2
    source: brief.md
    text: 管理员关闭提醒后，即使用户余额低于阈值也不创建或发送提醒；重新开启后只对新的低余额周期生效。
    result: passed
    reason:
      text: Disabling suppresses creation/delivery and re-enabling requires a new
        crossing.
      truncated: false
  - id: A3
    source: brief.md
    text: 用户个人阈值为非空值时使用个人值；个人阈值留空时使用管理员全局值。
    result: passed
    reason:
      text: Personal positive thresholds override the global value; empty/zero
        inherits the global value.
      truncated: false
  - id: A4
    source: brief.md
    text: 内置模板可以切换并预览；自定义模板只允许白名单变量（`username`、`remaining_quota`、`threshold`、`currency_symbol`、`top_up_url`、`site_name`），未知变量在保存和发送前被拒绝。
    result: passed
    reason:
      text: Built-in and custom templates are selectable/previewable and use the
        documented variable whitelist.
      truncated: false
  - id: A5
    source: brief.md
    text: 测试收件邮箱为空、格式非法或 SMTP 发送失败时返回明确错误；成功时只发送测试邮件，不改变任何用户的提醒状态。
    result: passed
    reason:
      text: Test recipient validation and SMTP failure handling return explicit errors
        without mutating user state.
      truncated: false
  - id: A6
    source: brief.md
    text: 权威余额由高于或等于阈值变为低于阈值时，重复扫描和并发请求最多创建一个发送记录；发送失败可由系统任务重试，成功后不重复发送。
    result: passed
    reason:
      text: Transactional crossing, delivery claims, retries, and stale-worker
        protection deduplicate reminders.
      truncated: false
  - id: A7
    source: brief.md
    text: 充值、退款或管理员调整使钱包余额回到阈值以上后，下一次再次跌破阈值可以重新提醒；订阅状态独立验证同样规则，钱包恢复不会重置订阅状态，反之亦然。
    result: passed
    reason:
      text: Direct, batch, subtract, override, and add paths retain previous balance;
        first administrator high-to-low crossings create low_pending, recovery
        re-arms, and wallet/subscription states remain independent.
      truncated: false
  - id: A8
    source: brief.md
    text: SQLite、MySQL 5.7.8+ 和 PostgreSQL 9.6+ 均可完成迁移、读写提醒状态和并发去重查询。
    result: passed
    reason:
      text: GORM migration and locking/query patterns are dialect-neutral; live
        MySQL/PostgreSQL execution was not available.
      truncated: false
  - id: A9
    source: specs/low-quota-email-reminder/spec.md
    text: The administrator configuration has an enable switch, a global threshold,
      a selected built-in or custom template, and a test recipient address. The
      global threshold defaults to one unit of the site's current displayed
      quota unit. The API accepts displayed-unit input and stores a normalized
      value together with the unit semantics used at save time. Reading the
      configuration renders the saved value using those semantics, so later
      exchange-rate or display-unit changes do not reinterpret an existing
      threshold.
    result: passed
    reason:
      text: Administrator configuration stores enabled state, displayed threshold,
        template, and immutable unit/rate snapshot.
      truncated: false
  - id: A10
    source: specs/low-quota-email-reminder/spec.md
    text: The configuration is disabled only when the administrator turns it off.
      When disabled, no low-quota reminder is created or sent. Re-enabling does
      not retroactively send for an already-low balance; a new crossing after
      re-enabling is required.
    result: passed
    reason:
      text: Disabled configuration suppresses reminders and re-enable does not
        retroactively send.
      truncated: false
  - id: A11
    source: specs/low-quota-email-reminder/spec.md
    text: "`UserSetting.QuotaWarningThreshold` remains optional. A non-empty,
      positive value is interpreted in the current displayed unit at the time
      the user saves it and is normalized with the same unit metadata as the
      global value. An empty value means inheritance from the global threshold.
      Invalid, negative, non-finite, or out-of-range values are rejected with a
      client error."
    result: passed
    reason:
      text: Personal threshold input is optional, normalized with unit metadata, and
        rejects invalid/non-finite/out-of-range values.
      truncated: false
  - id: A12
    source: specs/low-quota-email-reminder/spec.md
    text: "Built-in templates are selectable and previewable. A custom template has
      a subject, HTML body, and plain-text body. Rendering accepts only these
      variables:"
    result: passed
    reason:
      text: Built-in/custom subject, HTML, and text templates are implemented with
        preview support.
      truncated: false
  - id: A13
    source: specs/low-quota-email-reminder/spec.md
    text: "`username`, `remaining_quota`, `threshold`, `currency_symbol`,
      `top_up_url`, `site_name`."
    result: passed
    reason:
      text: The six documented template variables are the only accepted variables.
      truncated: false
  - id: A14
    source: specs/low-quota-email-reminder/spec.md
    text: Unknown variables, malformed delimiters, or missing required custom fields
      fail validation before persistence and before send. Values are escaped
      according to the output context; HTML bodies must not allow template
      content to inject arbitrary server-side expressions.
    result: passed
    reason:
      text: Malformed/unknown templates are rejected; HTML values are escaped and
        subject CR/LF is sanitized.
      truncated: false
  - id: A15
    source: specs/low-quota-email-reminder/spec.md
    text: "Wallet and subscription balances have independent reminder state records.
      Each state is associated with a user, balance kind, and effective
      threshold. The state machine is:"
    result: passed
    reason:
      text: Wallet and subscription have independent keyed reminder state records.
      truncated: false
  - id: A16
    source: specs/low-quota-email-reminder/spec.md
    text: "`armed` -> `low_pending` -> `sent`"
    result: passed
    reason:
      text: The state machine implements armed, low_pending, sending, and sent
        transitions.
      truncated: false
  - id: A17
    source: specs/low-quota-email-reminder/spec.md
    text: and any balance at or above the threshold transitions `low_pending` or
      `sent` back to `armed`. A crossing is defined as an authoritative
      post-settlement or post-adjustment balance changing from `>= threshold` to
      `< threshold`. A balance that is already below the threshold does not
      create another reminder on repeated scans.
    result: passed
    reason:
      text: Recovery at or above threshold re-arms; repeated low observations do not
        create another cycle.
      truncated: false
  - id: A18
    source: specs/low-quota-email-reminder/spec.md
    text: Creation and deduplication occur transactionally. Concurrent requests or
      compensation scans may race, but only one transition for a given
      low-balance cycle can enqueue/send a reminder. Failed delivery remains
      retryable without creating another logical reminder. A successful delivery
      records the template and threshold snapshot used for auditability.
    result: passed
    reason:
      text: WithSnapshot captures display semantics only when a cycle opens, retains
        them through pending/sending/retry, and token-aware delivery renders
        from the persisted snapshot while recording template/threshold audit
        data.
      truncated: false
  - id: A19
    source: specs/low-quota-email-reminder/spec.md
    text: The recipient is the user's notification email when configured, otherwise
      the user's default email. If no email exists, the reminder is skipped with
      an audit log and the state remains retryable/armed according to the
      implementation's delivery policy; no fake success is recorded.
    result: passed
    reason:
      text: Notification email falls back to default email; missing email is logged
        and remains retryable without fake success.
      truncated: false
  - id: A20
    source: specs/low-quota-email-reminder/spec.md
    text: An administrator-only endpoint sends the selected template rendered with
      safe example values to the explicitly supplied test address using current
      SMTP settings. It validates address and template first, returns a
      structured success or error response, and never mutates user reminder
      state or consumes quota.
    result: passed
    reason:
      text: Administrator-only test-email endpoint validates recipient/template, sends
        through current SMTP, and does not mutate reminder state or quota.
      truncated: false
  - id: A21
    source: specs/low-quota-email-reminder/spec.md
    text: The existing system-task framework periodically scans enabled users with
      authoritative low balances and retryable reminder records. It applies the
      same transactional state transition and template snapshot rules as
      synchronous settlement hooks. The task is safe to run repeatedly and
      across multiple instances.
    result: passed
    reason:
      text: System-task compensation scans pending/stale states and reuses
        transactional claims and snapshot-aware delivery.
      truncated: false
  - id: A22
    source: specs/low-quota-email-reminder/spec.md
    text: All persistence uses GORM patterns compatible with SQLite, MySQL 5.7.8+,
      and PostgreSQL 9.6+. Migrations avoid dialect-specific column types and
      raw locking syntax. Quota conversion uses the common saturation helpers
      and rejects invalid user-controlled multipliers. Existing SMTP,
      NotifyUser, and other notification channels retain their behavior.
    result: passed
    reason:
      text: Persistence uses GORM-compatible patterns and existing SMTP/legacy
        notification channels remain supported; cross-database live execution
        was unavailable.
      truncated: false
  - id: A23
    source: specs/low-quota-email-reminder/spec.md
    text: Display-unit threshold conversion and default `1` are correct for USD,
      CNY, CUSTOM, and TOKENS.
    result: passed
    reason:
      text: USD/CNY/CUSTOM/TOKENS conversion and default 1 behavior are covered by
        tests.
      truncated: false
  - id: A24
    source: specs/low-quota-email-reminder/spec.md
    text: Personal override and empty-value inheritance are correct.
    result: passed
    reason:
      text: Personal override and empty-value inheritance are covered and preserve
        saved metadata.
      truncated: false
  - id: A25
    source: specs/low-quota-email-reminder/spec.md
    text: Template selection, preview, whitelist validation, and context-safe
      rendering are correct.
    result: passed
    reason:
      text: Template selection, preview, whitelist validation, and context-safe
        rendering are implemented.
      truncated: false
  - id: A26
    source: specs/low-quota-email-reminder/spec.md
    text: Test-email API handles success, invalid address, invalid template, and
      SMTP failure without changing reminder state.
    result: passed
    reason:
      text: Test-email success, invalid address/template, and SMTP failure paths are
        implemented without state mutation.
      truncated: false
  - id: A27
    source: specs/low-quota-email-reminder/spec.md
    text: Wallet crossing creates at most one reminder per cycle; repeated low scans
      do not resend; recovery re-arms it.
    result: passed
    reason:
      text: Wallet crossing deduplicates cycles, supports retries, and re-arms after
        recovery, including first administrator adjustments.
      truncated: false
  - id: A28
    source: specs/low-quota-email-reminder/spec.md
    text: Subscription lifecycle follows the same rules independently from wallet
      lifecycle.
    result: passed
    reason:
      text: Subscription lifecycle is independently keyed and follows the same
        crossing/recovery rules.
      truncated: false
  - id: A29
    source: specs/low-quota-email-reminder/spec.md
    text: Persistence and migration work on all three supported databases, including
      concurrent deduplication.
    result: passed
    reason:
      text: Migration, locking, and concurrent deduplication code is dialect-neutral;
        only SQLite was executable locally.
      truncated: false
  - id: A30
    source: specs/low-quota-email-reminder/spec.md
    text: Admin authorization, email absence, retry behavior, observability, i18n,
      changelog, and regression compatibility are covered.
    result: passed
    reason:
      text: Authorization, no-email handling, retries, observability, i18n, regression
        coverage, and a YYYYMMDD-<sha> changelog entry are present; final
        release should replace the current HEAD hash with the actual merge SHA.
      truncated: false

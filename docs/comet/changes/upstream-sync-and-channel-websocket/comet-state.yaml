    text: 长耗时使用同请求分阶段证据定位，区分首事件、首文本、终止和记录时间，不承诺上游生成速度。日志顶部 TPM 右侧增加当前登录用户今日缓存率与总
      Token；使用本地自然日，独立列表过滤，加权缓存率，不重复计入缓存，支持空值、翻译、隐私和跨日刷新。

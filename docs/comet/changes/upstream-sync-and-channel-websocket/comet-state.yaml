  - id: A7
    source: specs/channel-upstream-websocket/spec.md
    text: 渠道 `setting` JSON 可选字段 `upstream_transport`：空值或 `http` 表示现有 HTTP
      上游；`websocket` 只对流式 OpenAI Responses 请求生效。非流式 Responses、Responses
      compact、Chat Completions、Realtime、音频、图片、视频和其他端点继续使用现有路径。
    result: passed
    reason:
      text: upstream_transport remains optional; empty/http preserves HTTP and
        websocket is limited to streaming OpenAI Responses while other paths
        retain baseline behavior.
      truncated: false
  - id: A8
    source: specs/channel-upstream-websocket/spec.md
    text: new-api 以渠道配置的 Base URL、Authorization 和安全的头部覆盖规则建立 `ws`/`wss`
      连接。CLIProxyAPI/CPA 的 Responses WebSocket 先升级规范的 `/v1/responses`
      路由；为兼容旧部署，再按 `/v1/responses/ws`、`/v1/ws` 顺序探测别名。`/v1/ws` 仅作为最后兼容路径，避免误选
      CPA 的通用 WebSocket relay。不把密钥或完整请求体写入日志。
    result: passed
    reason:
      text: Bridge builds ws/wss candidates, tries canonical /v1/responses before
        aliases, applies trusted relay request ID after overrides, and does not
        log bodies or secrets.
      truncated: false
  - id: A9
    source: specs/channel-upstream-websocket/spec.md
    text: WS 连接在 new-api
      进程内按渠道上游、鉴权指纹和模型隔离。首轮请求只有在提供稳定的会话标识（例如受信任的会话/对话头）时才可绑定空闲连接；没有会话标识的首轮请求必须建立新连接，避免不同会话共享上游上下文。后续请求带有
      `previous_response_id` 时，优先复用生成该 ID 的连接；`store=false`
      的请求必须保持同一连接语义，不能仅凭全局空闲连接猜测上下文。
    result: passed
    reason:
      text: Pool keys isolate endpoint, authentication, query, model, user, channel,
        and proxy; session reuse, previous_response_id affinity, and store=false
        behavior are covered.
      truncated: false
  - id: A10
    source: specs/channel-upstream-websocket/spec.md
    text: 每条连接同一时刻只能被一个请求
      lease；正常终止后归还连接池，连接空闲超时、达到最大生命周期、写入/读取失败或协议错误时淘汰。借用空闲连接时执行有界的健康检查；仅请求尚未尝试发送时允许安全重建；发送后读取失败不重放。请求取消会释放当前
      lease，所有 goroutine、管道和连接均有确定的退出路径。
    result: passed
    reason:
      text: Leases are serial, healthy entries return, unhealthy/cancelled entries are
        evicted, and timeout/rebuild/no-replay rules are implemented and tested.
      truncated: false
  - id: A11
    source: specs/channel-upstream-websocket/spec.md
    text: 把已完成的 Responses 请求包为上游要求的 `response.create` 文本事件。上游 Responses 事件按现有 relay
      SSE 语义发送给客户端，保留事件类型、JSON 内容和顺序；终止事件中的 usage 继续交给既有 Responses
      handler、预扣、结算和日志链路。
    result: passed
    reason:
      text: Payload is wrapped as response.create; event JSON and ordering are
        forwarded as SSE and usage remains on the established handler and
        billing path.
      truncated: false
  - id: A12
    source: specs/channel-upstream-websocket/spec.md
    text: 只有尚未尝试发送请求的握手失败可安全回落 HTTP。尝试写入后，即使首帧未到也不得自动重放。取消、错误与终止事件及时释放资源。上游返回的合法
      Responses `error` / `response.error` 事件按 SSE
      原样传递给客户端，并作为终止事件记录分阶段时序；本地无法解析的首帧仍视为 bridge 协议错误。
    result: passed
    reason:
      text: Only pre-write failures can fall back; post-write errors do not replay,
        and valid provider-error events are forwarded as SSE with cleanup.
      truncated: false
  - id: A13
    source: specs/channel-upstream-websocket/spec.md
    text: default 与 classic 渠道编辑器均显示 HTTP/WebSocket 选项、默认 HTTP、i18n
      文案和服务端非法值错误映射；配置保存在现有 `setting` JSON，不新增列。
    result: passed
    reason:
      text: Channel configuration validates HTTP/WebSocket values, preserves HTTP
        default, serializes without a schema column, and frontend forms cover
        the option.
      truncated: false
  - id: A14
    source: specs/channel-upstream-websocket/spec.md
    text: deterministic fixture 覆盖 URL、鉴权、`response.create`、多帧转 SSE、usage、终止、错误、取消和

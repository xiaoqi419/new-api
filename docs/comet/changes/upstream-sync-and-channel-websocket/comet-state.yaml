      粘性、不同会话隔离、连接失效淘汰、发送前安全重建、发送后禁止重放和单连接串行 lease。
    result: passed
    reason:
      text: Fixtures cover session reuse, previous_response_id stickiness, identity
        isolation, eviction, pre-send rebuild, post-send no replay, and
        single-lease behavior.
      truncated: false
  - id: A16
    source: specs/channel-upstream-websocket/spec.md
    text: 真实测试 CPA 验证规范 `/v1/responses` WS 路由、`response.create`、Responses 事件和
      usage，并确认 new-api 客户端仍收到 `text/event-stream` SSE；实现保留 `/v1/responses/ws` 与
      `/v1/ws` 兼容探测。
    result: passed
    reason:
      text: Fresh live CPA evidence exercised canonical /v1/responses. A legal
        type:error/model_not_found event was preserved as SSE with
        upstream_error_event timing, and gpt-5.6-terra returned

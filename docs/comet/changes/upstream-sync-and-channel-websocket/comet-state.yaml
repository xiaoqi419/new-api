  summary:
    text: Implemented an in-process CPA Responses WebSocket pool in new-api.
      Streaming Responses requests keep the existing HTTP/SSE client contract
      while reusing sockets only for explicit inbound session/thread hints or a
      response ID mapped to its producing connection. Pool keys isolate
      endpoint, authorization fingerprint, and model; leases are serialized,
      healthy terminals are returned, and broken, canceled, stale, or
      protocol-failed sockets are evicted. Reused sockets may be rebuilt once
      before the first response frame; after output begins no request replay
      occurs. Added deterministic fixtures for stable-session and
      previous-response reuse, session isolation, store=false affinity, serial
      leases, closed-connection rebuild, inbound hint validation, and existing
      fallback/cancellation behavior.
    truncated: false

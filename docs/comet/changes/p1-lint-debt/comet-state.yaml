  - id: A10
    source: specs/frontend-lint-quality/spec.md
    text: 只允许已批准的 iframe 信任模型例外 - 目标分支 `web/.oxlintrc.json` 的既有批准例外是一个只匹配
      `src/features/canvas/index.tsx`、只关闭 `react/iframe-missing-sandbox` 的
      override，用于落实已确认的可信同源 Canvas 模型。 - 本 change 新增的唯一配置变化是一个同时匹配
      `src/routes/_authenticated/chat/$chatId.tsx`、`classic/src/pages/Chat/index.jsx`、`classic/src/pages/About/index.jsx`、`classic/src/pages/Home/index.jsx`，且只关闭
      `react/iframe-missing-sandbox` 的 override，用于落实已确认的管理员受信任外部集成模型。 - 四处外部
      iframe 保持现有脚本、同源存储、Cookie、OAuth、表单、弹窗和媒体能力；不添加会破坏现有集成契约的限制性
      sandbox。管理员账户或配置失陷可能暴露 URL 注入的 API key 或滥用 iframe 权限，该残余风险必须留档。 - 未使用的通用
      `WebPreviewBody` 必须从 sandbox 删除 `allow-same-origin`，同时保留
      scripts/forms/popups/presentation，使任意 URL preview 使用 opaque origin。 -
      除上述四文件单规则 override 外，本 change 不修改 oxlint rules、severity、plugins、overrides
      或 ignore patterns，也不得扩大两个精确 iframe 例外。 - 不增加
      `eslint-disable`、`oxlint-disable` 或等价行内/文件级豁免。 - 不使用 `--fix`、`lint:fix`
      或其他未审阅的批量自动改写。 - 不升级依赖、不修改 package scripts/lockfile、不排除目录，也不扩张到 warning
      专项、UI 重设计、功能开发、classic 迁移、后端或微信登录。
    result: pending
    reason: null

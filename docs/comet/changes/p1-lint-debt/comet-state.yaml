  - id: A8
    source: specs/frontend-lint-quality/spec.md
    text: 语义性与机械性修复保持现有行为 - Hooks dependency 修复保持请求触发、订阅建立/销毁、闭包取值和 render
      次数的业务语义，不通过删除依赖或 disable 规则通过。 - Promise 修复明确处理或向调用方返回 rejection，不新增空
      catch 或静默吞错。 - Component export 修复可在相同 feature/helper 边界内拆分模块，但保持既有
      import/export 契约；高扇出 helper 先合入再处理调用方。 - Array key 使用真实稳定
      identity；Type-only import 保留有副作用模块的运行时加载。 -
      机械规则修复保持分支、短路、浅拷贝、字符串全局替换和索引语义不变。

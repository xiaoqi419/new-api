<!doctype html>
<html lang="zh-CN" data-theme="maintenance">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>此网站在您所在地区暂不可访问</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(#1a1a1a 1px, transparent 1px),
        linear-gradient(90deg, #1a1a1a 1px, transparent 1px),
        #0e0e0e;
      background-size: 48px 48px;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      border: 1px solid #2d2d2d;
      background: #141414;
      padding: 40px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .32);
    }
    .status {
      margin: 0 0 16px;
      color: #d4ff1f;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    h1 {
      margin: 0;
      color: #f5f5f5;
      font-size: 28px;
      line-height: 1.3;
    }
    p {
      margin: 16px 0 0;
      color: #a0a0a0;
      font-size: 16px;
      line-height: 1.65;
    }
    .legal-copy {
      color: #a0a0a0;
    }
    .translation { color: #d2d2d2; }
    .legal-reference {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 14px;
      margin-top: 24px;
      padding: 18px 20px;
      border: 1px solid #373737;
      border-left: 3px solid #d4ff1f;
      border-radius: 10px;
      background: #1c1c1c;
    }
    .legal-reference svg {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      color: #d4ff1f;
    }
    .reference-label {
      margin: 0;
      color: #a0a0a0;
      font-size: 13px;
      line-height: 1.5;
    }
    .reference-link {
      display: inline-block;
      margin-top: 7px;
      color: #d4ff1f;
      font-size: 16px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      text-decoration: underline;
      text-decoration-color: rgba(212, 255, 31, .55);
      text-underline-offset: 4px;
    }
    .reference-link:hover,
    .reference-link:focus-visible { color: #e7ff85; }
    .apology { margin-top: 26px; color: #a0a0a0; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      main { padding: 24px; }
      h1 { font-size: 24px; }
      .legal-reference { padding: 16px; }
      .reference-link { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="status">HTTP 451</p>
    <h1>此网站在您所在地区暂不可访问</h1>
    <p class="legal-copy">本站点遵循中华人民共和国《生成式人工智能服务管理暂行办法》及相关法律法规的要求，不面向中国大陆境内公众提供生成式人工智能服务，并已对来自中国大陆地区的网络访问予以限制。</p>
    <section class="legal-reference" aria-label="法规依据">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3.75h8.25L18.5 8v12.25H6z" />
        <path d="M14 3.75V8h4.5M8.75 12h5.5M8.75 15.25h5.5" />
      </svg>
      <div>
        <p class="reference-label">法规依据 · 官方发布</p>
        <a class="reference-link" href="https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm" target="_blank" rel="noopener noreferrer">《生成式人工智能服务管理暂行办法》（国家互联网信息办公室等七部门联合发布）</a>
      </div>
    </section>
    <p class="apology">由此给您带来的不便，敬请谅解。</p>
    <p class="translation">Website access from mainland China is unavailable.</p>
  </main>
</body>
</html>
